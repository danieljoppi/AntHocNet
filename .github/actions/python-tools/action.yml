# Shared setup (#610): Python tools installed under the repository's pins.
# requirements/<tool>.txt holds each tool and its dependencies at exact
# versions and sha256 hashes (#787; an unpinned tool upgrade broke every PR
# once: ruff 0.16.0); every workflow installs through it.
name: Install pinned Python tools
description: pip install the named tools from requirements/<tool>.txt, hash-checked.
inputs:
  packages:
    description: space-separated tool names, each with a requirements/<tool>.txt
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PKGS: ${{ inputs.packages }}
      run: |
        args=()
        for p in $PKGS; do args+=(-r "requirements/$p.txt"); done
        pip install --require-hashes "${args[@]}"
