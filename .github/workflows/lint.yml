name: Lint

# Style/quality gate for the repository's tooling. Fast and dependency-light.
# (C++ formatting via clang-format is tracked separately — adopting it needs a
# one-time reformat — so it is not enforced here yet.)
on:
  push:
    branches: [main, master]
  pull_request:

# A force-push to a PR branch obsoletes the in-flight run — cancel it instead
# of paying for it twice. Main-branch runs are never cancelled
# (cancel-in-progress is false there): every merge keeps its own complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    name: Python tools (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Install ruff
        # Pinned: an unpinned install broke every PR when ruff 0.16.0 tightened
        # defaults (I001/ISC004/PLW1510/EXE001 on untouched files). The pin
        # lives in requirements-dev.txt so Dependabot can see it; bump it
        # there, fixing new findings in the same PR.
        run: pip install -c requirements-dev.txt ruff
      - name: Lint
        # The whole skill dir is linted: the per-file list this replaces (#336)
        # existed only because bench_parse.py and sweep_summary.py carried
        # pre-existing findings, and a list that must be extended by hand is
        # how a new script ships unlinted. Those findings are fixed; new skill
        # scripts are covered the moment they land.
        run: ruff check ns3/tools docs/tools .claude/skills/benchmark-results/
      - name: Statistics self-test (#293)
        # stats_util.py computes the 95% CIs and paired tests every published
        # number will carry; bench_parse.py's column-mapping check decides
        # whether a cell's numbers may be trusted at all. Same reasoning as
        # the gate below: a rule that can't fire isn't a gate.
        run: python3 .claude/skills/benchmark-results/test_stats.py
      - name: Benchmark-gate self-test
        # scenario_check.py decides whether a campaign's numbers may be read or
        # published, and it was itself untested until #229/#230 showed what that
        # costs: a metric can ship six merged campaigns' worth of numbers while
        # failing the self-check its own documentation defines. Cheap (no
        # simulator, no network, ~1 s) and it runs on every PR.
        run: python3 .claude/skills/benchmark-results/test_scenario_check.py
      - name: Mermaid render gate (docs)
        # A sequenceDiagram message carrying &lt;/&gt; parses as balanced text
        # locally but is a hard parse error in Mermaid's sequence grammar, so
        # GitHub renders "Unable to render rich display" for the whole diagram.
        # It shipped because the pre-commit check verified structure
        # (subgraph/end, bracket balance) and never asked whether Mermaid could
        # parse the block. Stdlib-only, <1 s, runs on every PR.
        run: |
          python3 docs/tools/check-mermaid.py --self-test
          python3 docs/tools/check-mermaid.py .
      - name: Relative-link gate (docs)
        # The docs lean on relative links — ADRs cite source files, benchmark
        # pages cite campaign CSVs — and a rename silently strands every
        # inbound link: the page still renders, the link just 404s when a
        # reader follows the cross-session trail (ADR-0013). External and
        # pure-#anchor targets are skipped so the gate cannot flake (#336).
        # Stdlib-only, <1 s, runs on every PR.
        run: |
          python3 docs/tools/check-links.py --self-test
          python3 docs/tools/check-links.py .
      - name: Licence header gate (#332)
        # Every source file must carry an SPDX identifier. The repo is
        # GPL-2.0-only but for its whole history the licence lived only in
        # LICENSE: GPLv2 §1 expects the notice to travel with the file, and
        # this is a protocol implementation people copy files out of. #332
        # added the notice to every file under core/, ns3/, ns2/src/ and the
        # Python tools; this keeps the next new file from landing without one.
        # ns2/patch/fragments/ is deliberately out of scope — those bytes are
        # inserted verbatim into a user's NS-2 tree and a comment line would
        # break the patch round-trip; ns2/patch/NOTICE covers them instead.
        # Stdlib-only, <1 s, runs on every PR.
        run: |
          python3 docs/tools/check-headers.py --self-test
          python3 docs/tools/check-headers.py .
      - name: Config default parity (core vs ns-2 vs ns-3)
        # A Config default that drifts in one tree only is the #252/#254
        # failure mode: proactiveInterval leaked 10 -> 2 in a PR that claimed
        # not to change it, and the benchmark regression took two days to
        # trace. core/tests/test_config_defaults.cpp pins the core values;
        # this pins the adapter copies to core. Cheap (stdlib-only regexes,
        # <1 s) and it runs on every PR. See #258.
        run: python3 ns3/tools/check-default-parity.py
