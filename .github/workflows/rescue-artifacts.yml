name: Rescue run artifacts into docs (manual)

# Rescue tool (#122): workflow artifacts expire, and a run's result data is
# irreplaceable without re-paying the simulation cost. It runs in seconds and
# does NOT dispatch any simulation.
#
# The first two modes (#122 scenario-matrix CSVs, #259 satellite-benchmark
# results) went with those workflows in v2.5.0 (#746): campaigns run on
# benchmark-cell.yml, whose artifacts the bundle mode below gathers. What they
# rescued is committed under results/campaign/.
#
# The per-merge mode (#229) serves the `benchmarks` workflow: its
# `benchmark-results` artifact carries the scenarios.csv with the drop_*_pct
# columns that the job log swallows (run-scenarios.py keeps only CSV rows), so
# the only drop-cause data the per-merge run produces dies with the artifact
# unless rescued. Lands as results/campaign/<runid>-merge.csv.
#
# bundle_run_ids gathers every artifact of each given run into ONE artifact,
# `rescue-bundle` (<run id>/<artifact files>), and commits nothing. A campaign
# (tools/bench/campaign.py) is 100+ runs; where artifacts can only be fetched
# one signed URL at a time, one bundle replaces 100+ fetches. Unpack it into
# DIR/<label>/ by the campaign's label -> run id log and pass `collect --from DIR`.
on:
  workflow_dispatch:
    inputs:
      merge_run_ids:
        description: 'Comma-separated workflow run IDs whose benchmark-results artifact (per-merge benchmarks workflow, #229) to rescue'
        default: ''
      bundle_run_ids:
        description: 'Comma-separated workflow run IDs whose artifacts to gather into one rescue-bundle artifact (campaign collect); commits nothing'
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  rescue:
    name: rescue campaign result artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download per-merge benchmark artifacts and stage CSVs (#229)
        if: github.event.inputs.merge_run_ids != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/campaign
          IFS=',' read -ra IDS <<< "${{ github.event.inputs.merge_run_ids }}"
          for id in "${IDS[@]}"; do
            id="$(echo "$id" | tr -d ' ')"
            # The per-merge `benchmarks` workflow's scenarios.csv is the only
            # place its drop_*_pct columns exist (the job log swallows them) —
            # the -merge suffix distinguishes it from manual campaign CSVs.
            label="merge"
            dir="rescue-tmp/$id"
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n benchmark-results -D "$dir"
            if [ ! -f "$dir/scenarios.csv" ]; then
              echo "FAIL: no scenarios.csv in benchmark-results artifact of run $id"; exit 1
            fi
            rows=$(( $(wc -l < "$dir/scenarios.csv") - 1 ))
            if [ "$rows" -lt 1 ]; then
              echo "FAIL: scenarios.csv of run $id has no data rows"; exit 1
            fi
            echo "run $id ($label): $rows data rows"
            cp "$dir/scenarios.csv" "results/campaign/${id}-${label}.csv"
          done
          rm -rf rescue-tmp
      - name: Gather run artifacts into one bundle (campaign collect)
        if: github.event.inputs.bundle_run_ids != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_RUN_IDS: ${{ github.event.inputs.bundle_run_ids }}
        run: |
          set -euo pipefail
          IFS=',' read -ra IDS <<< "$BUNDLE_RUN_IDS"
          for id in "${IDS[@]}"; do
            id="$(echo "$id" | tr -d ' ')"
            [[ "$id" =~ ^[0-9]+$ ]] || { echo "FAIL: not a run id: $id"; exit 1; }
            gh run download "$id" -R "$GITHUB_REPOSITORY" -D "rescue-bundle/$id"
            echo "run $id: $(find "rescue-bundle/$id" -type f | wc -l) file(s)"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event.inputs.bundle_run_ids != ''
        with:
          name: rescue-bundle
          path: rescue-bundle/
          retention-days: 7
      - name: Commit rescued results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/campaign
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "benchmarks: rescue per-merge results from expiring artifacts (#229) [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
