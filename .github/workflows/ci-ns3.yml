name: CI / ns-3

# The ns-3 module on the ns-3 release ns-3 supports, under ASan, and alone
# (BASELINES=0). Called by ci.yml (#610: ci.yml split by area behind the one CI
# gate, #607); not triggered on its own.
#
# ns-3 maintains its latest release only (no maintenance branches, no
# backports), so automatic CI (push, PR) runs on that release alone:
# ghcr.io/swarm-routing/ns3-dev:latest, published and moved to each new ns-3
# release by swarm-routing/ns3-containers (org CONTRIBUTING invariant 7). The
# gates, the satellite smoke and the release-tarball install run on the
# `gate-version` leg. Older ns-3 releases run only on demand: ci.yml's manual
# workflow_dispatch passes `versions` (e.g. ["3.36","3.42"]); their images are
# frozen history (3.36: this repo's own ns3:3.36). Published numbers do not run
# here: the campaign workflows keep this repo's own pinned images.
on:
  workflow_call:
    inputs:
      versions:
        description: 'JSON list of ns-3 versions for the build/test legs; "latest" = the release ns-3 supports'
        type: string
        default: '["latest"]'
      gate-version:
        description: 'The leg that also runs the gates, the satellite smoke, the tarball install, ASan and the alone jobs'
        type: string
        default: 'latest'

permissions:
  contents: read
  packages: read

jobs:
  ns3-build:
    name: NS-3 module build + test
    runs-on: ubuntu-latest
    # Build against a pre-built ns-3 image rather than compiling ns-3 from
    # scratch: the stock tree is already built, so CI only compiles the
    # AntHocNet module delta. Images: ghcr.io/swarm-routing/ns3-dev:<ver>
    # (ns-3's `default` profile, Ubuntu 24.04 / gcc-13, `mesh` built in); the
    # plain configure below matches their flags, so no stock object is
    # recompiled (verified on 3.48 and 3.49: 0 stock objects,
    # swarm-routing/ns3-containers#9). 3.36, on demand only, keeps this repo's
    # own image (images.yml, Ubuntu 22.04 / gcc-11).
    container:
      image: ${{ matrix.version == '3.36' && format('ghcr.io/{0}/ns3:3.36', github.repository_owner) || format('ghcr.io/swarm-routing/ns3-dev:{0}', matrix.version) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        # The release ns-3 supports by default; older releases on demand
        # (ci.yml workflow_dispatch) to check API drift against them. The gate
        # version always gets a leg (no duplicate when it is already listed),
        # so the gates never skip silently on a manual run.
        version: ${{ fromJSON(inputs.versions) }}
        include:
          - version: ${{ inputs.gate-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ccache (#609) for the legs that recompile all of ns-3, not only the
      # module: 3.36 (its reconfigure invalidates the image's build) and ASan
      # (new compile flags). The other legs rebuild only the module delta in
      # 35-48 s and stay without it: ns-3 picks ccache up at configure time,
      # which changes every compile command and would force the full rebuild
      # it is meant to save. Keyed per leg and commit; a run restores the
      # newest entry of its leg and saves a new one unless it hit exactly.
      - name: Restore ccache
        id: ccache
        if: matrix.version == '3.36'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-ns3-3.36-gcc11-${{ github.sha }}
          restore-keys: ccache-ns3-3.36-gcc11-
      - name: Install ccache
        if: matrix.version == '3.36'
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends ccache
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          printf 'CCACHE_DIR=%s\nCCACHE_MAXSIZE=1G\n' "$CCACHE_DIR" >> "$GITHUB_ENV"
          ccache -z
      - name: Install AntHocNet module
        # The gate leg installs from the drop-in release tarball (#606) instead
        # of the Makefile, so every PR proves the asset a user downloads builds
        # and passes the same tests; the other legs keep `make install-ns3`.
        uses: ./.github/actions/ns3-install
        with:
          from-tarball: ${{ matrix.version == inputs.gate-version }}
      - name: make doctor (#605)
        # The pre-install checker must recognise every supported tree and the
        # installed modules; its ##DOCTOR## line is what the learn site parses.
        run: |
          out=$(make -s doctor NS3DIR=/opt/ns-3)
          echo "$out"
          line=$(printf '%s\n' "$out" | grep '^##DOCTOR## ')
          want='${{ matrix.version }}'
          [ "$want" = latest ] && want="$NS3_VERSION"   # set by the ns3-dev images
          case "$line" in *" ns3=$want "*) ;; *) echo "FAIL: doctor misread the version (want $want)"; exit 1;; esac
          case "$line" in *" module=installed "*) ;; *) echo "FAIL: doctor did not see the module"; exit 1;; esac
          case "$line" in *"baselines=aomdv:ok,gpsr:ok,oracle:ok,adaptive:ok,routing-bench:ok "*) ;; *) echo "FAIL: doctor did not see the baselines"; exit 1;; esac
      - name: Configure (scope examples/tests to AntHocNet)
        run: |
          cd /opt/ns-3
          # Build only AntHocNet's own examples/tests, not the stock modules'
          # (their cross-module deps drift by release). The filter flag scopes
          # that to our module; it was added after ns-3.36, so older trees just
          # build + smoke.
          mods='anthocnet;aomdv;gpsr;oracle;adaptive;routing-bench;wifi;mobility;applications;csma;aodv;olsr;dsdv;flow-monitor;point-to-point;mesh'
          if ./ns3 configure --help 2>/dev/null | grep -q filter-module-examples-and-tests; then
            ./ns3 configure --enable-tests --enable-examples \
              --filter-module-examples-and-tests='anthocnet;oracle;adaptive;routing-bench' \
              --enable-modules="$mods"
            echo "RUN_TESTS=1" >> "$GITHUB_ENV"
          else
            ./ns3 configure --enable-examples --enable-modules="$mods"
            echo "RUN_TESTS=0" >> "$GITHUB_ENV"
          fi
      - name: Build
        run: cd /opt/ns-3 && ./ns3 build
      - name: ccache stats
        if: matrix.version == '3.36'
        run: ccache -s
      - name: Save ccache
        if: matrix.version == '3.36' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .ccache
          key: ccache-ns3-3.36-gcc11-${{ github.sha }}
      - name: Run module test suite (header round-trip + multi-hop delivery)
        if: env.RUN_TESTS == '1'
        run: cd /opt/ns-3 && ./test.py -s anthocnet && ./test.py -s oracle && ./test.py -s adaptive && ./test.py -s routing-bench
      - name: Smoke-run the example
        run: cd /opt/ns-3 && ./ns3 run anthocnet-example
      - name: E2E delivery smoke (AntHocNet must deliver in a connected scenario)
        # Loose behavioural gate: in a small, dense, connected scenario AntHocNet
        # must deliver *something* (catches "routes nothing" regressions, not
        # performance noise — that lives in the manual benchmarks). Parse the
        # AntHocNet PDR from the --csv output and require it to be > 0.
        run: |
          cd /opt/ns-3
          out=$(./ns3 run "anthocnet-compare --csv --protocols=anthocnet --nNodes=8 --time=20 --area=150 --flows=2" 2>/dev/null)
          echo "$out"
          pdr=$(printf '%s\n' "$out" | awk -F, '$1=="anthocnet"{print $7}')
          echo "AntHocNet PDR% = ${pdr:-<none>}"
          awk -v p="${pdr:-0}" 'BEGIN { exit (p+0 > 0) ? 0 : 1 }' \
            || { echo "FAIL: AntHocNet delivered no packets (PDR=${pdr:-<none>})"; exit 1; }
      - name: ISL-grid delivery smoke (#214 — multi-interface satellite shape)
        # The same loose "must deliver something" gate as above, on the topology
        # the satellite track needs (#192): a +Grid torus of point-to-point
        # links where every node holds 4 ISLs on 4 separate subnets. This is the
        # shape that the #203 multi-interface fix exists for, so a regression
        # there shows up here as zero delivery rather than only in a manual run.
        # Kept small (4x4, 30 s) so it costs a few seconds per matrix leg.
        run: |
          cd /opt/ns-3
          out=$(./ns3 run "isl-grid --csv --protocols=anthocnet --rows=4 --cols=4 --time=30 --flows=2" 2>/dev/null)
          echo "$out"
          pdr=$(printf '%s\n' "$out" | awk -F, '$1=="anthocnet"{print $9}')
          echo "AntHocNet ISL-grid PDR% = ${pdr:-<none>}"
          awk -v p="${pdr:-0}" 'BEGIN { exit (p+0 > 0) ? 0 : 1 }' \
            || { echo "FAIL: AntHocNet delivered no packets on the ISL grid (PDR=${pdr:-<none>})"; exit 1; }
      - name: 3-D field smoke (#480, --areaZ for the FANET family)
        # --areaZ > 0 must really place AND move nodes in a 3-D box (altitude
        # span from the harness's `# geom` diagnostic at t=0 and mid-run), under
        # both gaussmarkov and rwp; every 3-D-capable arm must deliver; each
        # 3-D run must be byte-identical on the same seed; and every arm that
        # would otherwise silently flatten the field is refused (tworay,
        # nakagami, ssrwp, gpsr), as is a negative --areaZ.
        # The mid-run sample exists because the first draft passed a t=0-only
        # check while the mobility bounds clamped every node back to z = 0.
        if: matrix.version == inputs.gate-version
        run: bash tools/checks/check-3d-field.sh /opt/ns-3
      - name: Manhattan / urban smoke (#488, the VANET family)
        # --mobility=manhattan must keep every vehicle on the street grid
        # (`# road` diagnostic at t=0 and mid-run); every arm must deliver on
        # the urban channel; the oracle must read the building chain per pair
        # (mode decode-los-approx) and keep fewer edges than plain tworay; a
        # same-seed rerun is byte-identical; and the four unhonourable
        # combinations are refused.
        if: matrix.version == inputs.gate-version
        run: bash tools/checks/check-manhattan.sh /opt/ns-3
      - name: Tuning-bench ns-3 lines run in anthocnet-compare (#638)
        # The learn site's bench copies --ns3::anthocnet::RoutingProtocol::<Attr>
        # flags generated from config.h and configuration.md. Every field it
        # exposes, moved off its default as the bench writes it, must be
        # accepted by the module's TypeId: an unknown attribute or a malformed
        # value aborts the run. web/test/bench.test.mjs holds the page to the
        # same line.
        if: matrix.version == inputs.gate-version
        run: |
          python3 web/tools/config_fields.py check
          args=$(python3 web/tools/config_fields.py ns3-args)
          echo "$args"
          cd /opt/ns-3 && ./ns3 run "anthocnet-compare --csv --protocols=anthocnet --nNodes=8 --time=10 --area=150 --flows=1 $args"
      - name: Moving-constellation smoke (#192/#297, ADR-0022, leo-walker)
        # A 16x16 Walker shell on stock ns-3.48's LEO mobility model: the
        # geometry must match the analytic shell at t=0 and half an orbit
        # later, every ground station must be served, scheduled handovers,
        # the ISL failure overlay and a mass failure must all fire, every
        # arm (delay oracle, AntHocNet, AODV) must deliver through them, and
        # a same-seed rerun must be byte-identical and order-independent.
        # Needs ns-3 >= 3.48: the stock LEO model first ships there
        # (ADR-0022), and leo-walker is not built on older trees; it runs on
        # the gate leg, the release ns-3 supports. ~45 s.
        if: matrix.version == inputs.gate-version
        run: |
          minor=$(sed 's/^3\.\([0-9]*\).*/\1/' /opt/ns-3/VERSION)
          if [ "$minor" -lt 48 ]; then
            echo "skip: ns-3 3.$minor has no stock LEO model (needs >= 3.48, ADR-0022)"
            exit 0
          fi
          bash tools/checks/check-leo-walker.sh /opt/ns-3
      - name: Scene replay smoke (#639, --mobility=trace and --flowsFile)
        # The fixture trace + flow list delivers for AntHocNet and AODV, a
        # dumped RWP run replays byte-identically, and malformed files are
        # refused before the run. How a game level reaches ns-3 (#640).
        if: matrix.version == inputs.gate-version
        run: bash tools/checks/check-trace-replay.sh /opt/ns-3 "$GITHUB_WORKSPACE"
      - name: Partition/merge stress gate (#62, --seriesEvery)
        # Two teams, a bridge that withdraws and returns: AntHocNet's control
        # must plateau while the field is split (the #20/#45 storm class
        # grows) and every crossing flow must deliver within 60 s of each
        # merge. One 900 s seed.
        if: matrix.version == inputs.gate-version
        run: bash tools/checks/check-partition.sh /opt/ns-3 "$GITHUB_WORKSPACE"
      - name: Disaster-family gate (#580, --scenario=disaster --buildings)
        # The committed scene matches its generator; the walled fire
        # compartments cost the oracle >= 8 pp against the same scene with
        # their loss zeroed (else --buildings is not reaching the channel);
        # AntHocNet, AODV and OLSR each route. 300 s, 2 seeds.
        if: matrix.version == inputs.gate-version
        run: bash tools/checks/check-disaster.sh /opt/ns-3 "$GITHUB_WORKSPACE"
      - name: Validation-anchor gate (single-hop PDR floor, #59)
        # Blocking anchor from docs/benchmarks/methodology.md "Validation
        # anchors": on a static, in-range 2-node link the *stock* stack
        # (manet-baselines, no AntHocNet code) must deliver ~100% — a #51-style
        # channel/rate-manager regression reads ~50% and used to go completely
        # undetected. Runs on
        # one matrix version to keep CI cheap (this reuses the job's build);
        # the heavier Broch-field anchor runs per-merge in benchmarks.yml.
        # Thresholds: ns3/tools/anchors.yml.
        if: matrix.version == inputs.gate-version
        run: bash tools/checks/check-anchors.sh /opt/ns-3 single-hop
      - name: FANET anchors (#482, --scenario=fanet)
        # The FANET family's analytic anchors, gated before any FANET number is
        # published. Both shrink the --scenario=fanet preset to a field whose
        # answer follows from geometry, and route only stock AODV and the
        # oracle control (anthocnet-compare, because manet-baselines has no
        # 3-D field):
        #   fanet-single-hop-3d  100 m cube, 350 m range: every flow is one
        #                        hop, so PDR >= 99 and oracle hopsMean == 1.00;
        #   fanet-vertical-3d    10 x 10 x 1000 m column: oracle hopsMean must
        #                        exceed 1.2, which a field flattened to 2-D
        #                        (exactly 1.00) cannot.
        # Thresholds: ns3/tools/anchors.yml.
        if: matrix.version == inputs.gate-version
        run: |
          bash tools/checks/check-anchors.sh /opt/ns-3 fanet-single-hop-3d
          bash tools/checks/check-anchors.sh /opt/ns-3 fanet-vertical-3d
      - name: VANET anchors (#488, --scenario=vanet)
        # The VANET family's analytic anchors, gated before any VANET number is
        # published. Both shrink --scenario=vanet to one 280 x 280 m block
        # (anthocnet-compare; stock AODV and the oracle control only):
        #   vanet-single-hop  a 1 m building: every pair has line of sight
        #                     inside the decode radius, so PDR >= 99 and
        #                     oracle hopsMean ~ 1.00;
        #   vanet-building    a 180 m building: opposite streets relay around
        #                     a corner, so oracle hopsMean must exceed 1.2,
        #                     which a channel ignoring the building cannot.
        # Thresholds: ns3/tools/anchors.yml.
        if: matrix.version == inputs.gate-version
        run: |
          bash tools/checks/check-anchors.sh /opt/ns-3 vanet-single-hop
          bash tools/checks/check-anchors.sh /opt/ns-3 vanet-building
      - name: VANET GPCR anchor (#709, --protocols=gpcr)
        # GPCR's own paper trend (Lochert et al. 2005): around a blocked
        # corner it must beat GPSR on the same seeds by >= 2 pp (measured
        # +4.9 on this leg). Thresholds: ns3/tools/anchors.yml.
        if: matrix.version == inputs.gate-version
        run: bash tools/checks/check-anchors.sh /opt/ns-3 vanet-gpcr-vs-gpsr
      - name: FANET gpsr3d anchor (#710, --protocols=gpsr3d)
        # The 3-D geographic arm's own paper trend (Bujari et al., IEEE TMC
        # 2018): on a static 3-D field, CFace(3) recovery must deliver >= 5 pp
        # more than greedy alone on the same seeds (measured +12.4 on this
        # leg). Thresholds: ns3/tools/anchors.yml.
        if: matrix.version == inputs.gate-version
        run: bash tools/checks/check-anchors.sh /opt/ns-3 fanet-gpsr3d-recovery
      - name: Static-mesh HWMP anchor (#708, --protocols=hwmp)
        # The static mesh's 802.11s comparator, gated before any HWMP number is
        # published. On a static connected disk field at one fixed rate,
        # HWMP's airtime metric is equal on every link, so its mean hop count
        # must sit in [1.00, 1.10] x the oracle's shortest path on the same
        # seeds (below 1.00 the arm ran on a different topology), with PDR
        # >= 95. Thresholds: ns3/tools/anchors.yml.
        if: matrix.version == inputs.gate-version
        run: bash tools/checks/check-anchors.sh /opt/ns-3 mesh-hwmp-shortest
      - name: Determinism gate (same seed twice must be byte-identical, #129)
        # Golden rule 3 (AGENTS.md): all randomness via IRng, all time via
        # IClock, so identical seeds must reproduce identical runs — the
        # property the per-protocol comparison on identical realisations rests
        # on. Runs anthocnet-compare twice with identical parameters and diffs
        # the per-protocol metric rows; a stray rand(), an uninjected
        # wall-clock read, or unordered-container iteration feeding a decision
        # fails here instead of silently invalidating every benchmark. Same
        # single-matrix-version placement as the anchor gate above to keep CI
        # cheap (reuses this job's build).
        if: matrix.version == inputs.gate-version
        run: bash tools/checks/check-determinism.sh /opt/ns-3
      - name: Seed-independence gate (a run must depend on its seed alone, #352)
        # Stronger than the determinism gate above: identical invocations were
        # already reproducible, but a run's realisation also leaked its
        # *position* in the process. ns-3 assigns RandomVariableStream indices
        # from a global counter at construction and SetSeed/SetRun do not reset
        # it, so before #352 the same seed produced different numbers depending
        # on --runs, --firstRun and protocol order — i.e. campaign CSVs merged
        # across differently-shaped invocations silently compared unlike runs.
        # Checks both halves: the same seeds split across invocations, and the
        # same seeds with --protocols reversed. Covers anthocnet-compare (both
        # halves) and manet-baselines (order half only — it exposes no
        # --firstRun), and isl-grid's order half for the anthocnet arm only —
        # ns-3's AODV still keys its socket maps on heap addresses (#362).
        # 4 seeds x 30 simulated seconds on small fields, so it costs seconds; same
        # single-matrix-version placement as the gates above.
        if: matrix.version == inputs.gate-version
        run: python3 tools/checks/check-seed-independence.py /opt/ns-3 --seeds 4 --time 30
      - name: Arm delivery smoke (#429, every MANET arm must route multi-hop)
        # The MANET equivalent of the satellite arm smoke below, and the gate
        # that turns methodology.md's "no baseline merges without a smoke run
        # showing non-zero delivery and a drop book that closes" from prose
        # into something that can fail. Two vendored baselines merged green on
        # this whole matrix plus ASan and did not route (AOMDV #414/#416
        # single-hop only, GPSR #425 0.00% PDR on 40/40 campaign seeds) —
        # nothing per-PR ever ran the arms end-to-end and asked whether they
        # DELIVER. Runs every arm anthocnet-compare advertises on a small
        # static multi-hop field (multi-hop is load-bearing: #416 is invisible
        # on single-hop paths) and asserts per arm: PDR above a floor
        # (unconditional — #425 passed the delivery-gated invariants by
        # exemption), hopTx > 0, hopsMean > 1, and a drop book that closes.
        # The oracle arm anchors the scenario (near-100% or the scenario is
        # broken); gpsr/aomdv are expected-fails carried with their issue
        # numbers, and the gate fails if one of them unexpectedly delivers, so
        # the list cannot outlive the defects. ~2-3 min; same
        # single-matrix-version placement as the gates above.
        if: matrix.version == inputs.gate-version
        run: bash tools/checks/check-arm-delivery.sh /opt/ns-3

      - name: Satellite validation anchors (#237, ISL topology)
        # The ISL analogue of the anchor gate above, and stronger in kind: a
        # point-to-point link has no contention and no loss model, so the
        # expected values are *analytic* rather than literature-derived.
        #   single-isl — 2 satellites, 1 ISL: PDR must be ~100% (the #51
        #                lesson applied to the p2p stack).
        #   hop-delay  — 4x4 torus, both flows 2 hops: mean delay must sit in
        #                [h*d, h*d + slack]. The lower bound is the sharp one —
        #                below it the packet beat propagation, so either the
        #                channel delay is not applied (#200) or the topology is
        #                not the 2-hop path it claims (#226).
        # Same single-matrix-version placement as the gates above (ADR-0015
        # also fixes satellite CI to one ns-3 version). Thresholds:
        # ns3/tools/anchors.yml.
        if: matrix.version == inputs.gate-version
        run: |
          bash tools/checks/check-sat-anchors.sh /opt/ns-3 single-isl
          bash tools/checks/check-sat-anchors.sh /opt/ns-3 hop-delay
      - name: Satellite protocol-arm smoke (#420, every arm must run)
        # The gate that #420 was missing. Everything above this line asks what
        # *values* a run produces, and all of it on a single arm — so nothing
        # per-PR ever asked the cheaper question underneath: can each of the
        # suite's other arms run at all? They could not. DSDV aborted on every
        # multi-ISL grid from the day the arm was written and no CI leg noticed,
        # because the satellite legs run anchors and determinism, not the
        # protocol list. It took a 20-seed campaign dispatch to find out, and
        # the -opt profile reported it as a SIGSEGV with an empty stderr.
        #
        # Runs every supported arm on a 3x3 torus for 20 simulated seconds — the
        # smallest grid where every satellite still holds more than one ISL,
        # which is the precondition of the defect — and asserts each completes
        # and delivers something. Also asserts dsdv is *refused* up front rather
        # than crashing mid-run. Seconds in total; same single-matrix-version
        # placement as the gates above.
        if: matrix.version == inputs.gate-version
        run: bash tools/checks/check-sat-arms.sh /opt/ns-3
      - name: Determinism gate on the ISL topology (#237 S5)
        # Run separately from the wifi determinism gate rather than assuming it
        # follows: the ISL grid exercises a different device and channel, plus
        # the post-#203 multi-interface next-hop resolution whose peer map is
        # built from received hellos — an ordering a container-iteration bug
        # could perturb without ever showing on a single-interface wifi node.
        if: matrix.version == inputs.gate-version
        run: bash tools/checks/check-determinism.sh /opt/ns-3 isl-grid
  ns3-asan:
    name: NS-3 module under ASan + LSan
    runs-on: ubuntu-latest
    # Sanitize the adapter surface (pending-packet queue, timer cancel paths,
    # header <-> AntMessage conversion): rebuild the AntHocNet module and its
    # ns-3 dependencies with AddressSanitizer + LeakSanitizer, then re-run the
    # same module test suite and e2e delivery smoke as ns3-build. One version
    # (the gate leg, the release ns-3 supports) to bound cost. Non-blocking while the
    # LSan suppression file (tools/checks/lsan.supp) is calibrated against
    # upstream ns-3 static/global allocations — promote to blocking once green
    # on main (#130).
    continue-on-error: true
    container:
      image: ${{ inputs.gate-version == '3.36' && format('ghcr.io/{0}/ns3:3.36', github.repository_owner) || format('ghcr.io/swarm-routing/ns3-dev:{0}', inputs.gate-version) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # LeakSanitizer attaches to the process via ptrace at exit. The default
      # docker seccomp profile allows ptrace on current runners, but be
      # explicit so LSan can't start failing with "ptrace failed" after a
      # runner/docker update.
      options: --cap-add=SYS_PTRACE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ccache (#609), as in ns3-build: the sanitizer flags reach every
      # object, so this leg recompiles all of ns-3 (~15 min cold).
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-ns3-asan-${{ inputs.gate-version }}-gcc13-${{ github.sha }}
          restore-keys: ccache-ns3-asan-${{ inputs.gate-version }}-gcc13-
      - name: Install ccache
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends ccache
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          printf 'CCACHE_DIR=%s\nCCACHE_MAXSIZE=1G\n' "$CCACHE_DIR" >> "$GITHUB_ENV"
          ccache -z
      - name: Install AntHocNet module
        uses: ./.github/actions/ns3-install
      - name: Configure with ASan/LSan
        run: |
          cd /opt/ns-3
          # Scope LSan failures to AntHocNet code: suppress known upstream ns-3
          # static-initializer allocations (see the file header for how to
          # extend it). $GITHUB_WORKSPACE is the in-container checkout path.
          echo "LSAN_OPTIONS=suppressions=$GITHUB_WORKSPACE/tools/checks/lsan.supp" >> "$GITHUB_ENV"
          mods='anthocnet;aomdv;gpsr;oracle;adaptive;routing-bench;wifi;mobility;applications;csma;aodv;olsr;dsdv;flow-monitor;point-to-point;mesh'
          # ns-3's CMake build has first-class sanitizer support (NS3_SANITIZE),
          # exposed by the ./ns3 wrapper as --enable-sanitizers
          # (address + leak + undefined). Prefer it when the wrapper advertises
          # it — it is re-applied on every configure, so it works on the image's
          # already-configured tree. Fallback: inject the flags via
          # CXXFLAGS/LDFLAGS, which ns-3's CMake only reads on a *fresh*
          # configure, hence the ./ns3 clean first (the flag change forces a
          # full rebuild either way). The gate leg has --filter-module-examples-and-tests
          # (added after 3.36), so tests always run here.
          if ./ns3 configure --help 2>/dev/null | grep -q enable-sanitizers; then
            ./ns3 configure --enable-sanitizers --enable-tests --enable-examples \
              --filter-module-examples-and-tests='anthocnet;oracle;adaptive;routing-bench' \
              --enable-modules="$mods"
          else
            ./ns3 clean
            CXXFLAGS='-fsanitize=address -fno-omit-frame-pointer -g' \
            LDFLAGS='-fsanitize=address' \
            ./ns3 configure --enable-tests --enable-examples \
              --filter-module-examples-and-tests='anthocnet;oracle;adaptive;routing-bench' \
              --enable-modules="$mods"
          fi
      - name: Build
        run: cd /opt/ns-3 && ./ns3 build
      - name: ccache stats
        run: ccache -s
      - name: Save ccache
        if: steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .ccache
          key: ccache-ns3-asan-${{ inputs.gate-version }}-gcc13-${{ github.sha }}
      - name: Run module test suite under ASan/LSan
        run: cd /opt/ns-3 && ./test.py -s anthocnet && ./test.py -s oracle && ./test.py -s adaptive && ./test.py -s routing-bench
      - name: E2E delivery smoke under ASan/LSan
        # Same loose "routes data" gate as ns3-build, but without ns3-build's
        # `2>/dev/null` so sanitizer reports land in the job log (command
        # substitution only captures stdout, so the CSV parse is unaffected).
        run: |
          cd /opt/ns-3
          out=$(./ns3 run "anthocnet-compare --csv --protocols=anthocnet --nNodes=8 --time=20 --area=150 --flows=2")
          echo "$out"
          pdr=$(printf '%s\n' "$out" | awk -F, '$1=="anthocnet"{print $7}')
          echo "AntHocNet PDR% = ${pdr:-<none>}"
          awk -v p="${pdr:-0}" 'BEGIN { exit (p+0 > 0) ? 0 : 1 }' \
            || { echo "FAIL: AntHocNet delivered no packets (PDR=${pdr:-<none>})"; exit 1; }

  # BASELINES=0 (#605): AntHocNet alone, without the aomdv/gpsr/oracle
  # comparison modules. The module, its test suite and anthocnet-example must
  # build and pass; the comparison harnesses are skipped by ns-3 itself.
  ns3-core-only:
    name: NS-3 module alone (BASELINES=0)
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.gate-version == '3.36' && format('ghcr.io/{0}/ns3:3.36', github.repository_owner) || format('ghcr.io/swarm-routing/ns3-dev:{0}', inputs.gate-version) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install AntHocNet only
        uses: ./.github/actions/ns3-install
        with:
          baselines: '0'
      - name: make doctor reports the baselines missing, verdict still not fail
        run: |
          out=$(make -s doctor NS3DIR=/opt/ns-3)
          echo "$out"
          printf '%s\n' "$out" | grep -q '^##DOCTOR## .* baselines=aomdv:missing,gpsr:missing,oracle:missing,adaptive:missing,routing-bench:missing '
          ! printf '%s\n' "$out" | grep -q 'verdict=fail'
      - name: Configure, build, test, run the example
        run: |
          cd /opt/ns-3
          ./ns3 configure --enable-tests --enable-examples \
            --filter-module-examples-and-tests='anthocnet' \
            --enable-modules='anthocnet;wifi;mobility;applications;aodv;olsr;dsdv;flow-monitor;point-to-point;csma'
          ./ns3 build
          ./test.py -s anthocnet
          ./ns3 run anthocnet-example

  # ADR-0027 (#767, v2.6.0 exit criterion): the comparison harness alone, on
  # stock ns-3 -- routing-bench with no AntHocNet and no comparison module
  # beside it. It must build, pass its tests, offer exactly the stock arms and
  # deliver with them, and refuse an arm that is not installed.
  routing-bench-alone:
    name: routing-bench alone (stock ns-3 only)
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.gate-version == '3.36' && format('ghcr.io/{0}/ns3:3.36', github.repository_owner) || format('ghcr.io/swarm-routing/ns3-dev:{0}', inputs.gate-version) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install routing-bench only
        run: |
          d=/opt/ns-3/contrib/routing-bench
          mkdir -p "$d"
          cp -r ns3/routing-bench/model ns3/routing-bench/helper ns3/routing-bench/examples \
                ns3/routing-bench/test ns3/routing-bench/CMakeLists.txt "$d/"
      - name: Configure, build, test, run the stock arms
        run: |
          cd /opt/ns-3
          ./ns3 configure --enable-tests --enable-examples \
            --filter-module-examples-and-tests='routing-bench' \
            --enable-modules='routing-bench;wifi;mobility;applications;aodv;olsr;dsdv;flow-monitor;mesh'
          ./ns3 build
          ./test.py -s routing-bench
          help=$(./ns3 run "routing-compare --PrintHelp" 2>&1 || true)
          printf '%s\n' "$help" | grep -q 'Comma-separated list (aodv,dsdv,hwmp,olsr)' \
            || { echo "FAIL: routing-compare alone should offer exactly the stock arms"; printf '%s\n' "$help" | grep -i protocols; exit 1; }
          out=$(./ns3 run "routing-compare --scenario=paper --nNodes=20 --time=30 --runs=1" 2>&1)
          printf '%s\n' "$out" | grep '^##RUN##'
          for arm in aodv olsr dsdv; do
            printf '%s\n' "$out" | awk -v a="$arm" '$1=="##RUN##" && $3==a && $4>0 {f=1} END {exit !f}' \
              || { echo "FAIL: $arm delivered nothing"; exit 1; }
          done
          ./ns3 run "routing-compare --scenario=paper --nNodes=15 --time=20 --runs=1 --protocols=hwmp --standard=80211a --rateManager=constant6" 2>&1 \
            | awk '$1=="##RUN##" && $3=="hwmp" && $4>0 {f=1} END {exit !f}' \
            || { echo "FAIL: hwmp delivered nothing"; exit 1; }
          if ./ns3 run "routing-compare --protocols=anthocnet --nNodes=8 --time=5" >/tmp/u.log 2>&1; then
            echo "FAIL: an arm that is not installed must abort (#448)"; exit 1
          fi
          grep -q "unknown protocol 'anthocnet'" /tmp/u.log

  # #770 (v2.7.0 exit criterion): the standalone release packages
  # (routing-bench-<ver>.tar.gz, adaptive-<ver>.tar.gz), built by
  # tools/release/module-tarball.sh exactly as release.yml builds them, each
  # unpacked into a clean stock ns-3 tree: it must build, pass its tests and,
  # with the harness installed, every advertised arm must deliver multi-hop.
  # The harness alone and the harness with the adaptive arms run on every
  # version of the run; adaptive alone (it registers no arm without the
  # harness) on the gate leg.
  packages:
    name: package ${{ matrix.packages }} (ns-${{ matrix.version }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.version == '3.36' && format('ghcr.io/{0}/ns3:3.36', github.repository_owner) || format('ghcr.io/swarm-routing/ns3-dev:{0}', matrix.version) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.versions) }}
        packages: ['routing-bench', 'routing-bench,adaptive']
        include:
          - version: ${{ inputs.gate-version }}
            packages: 'adaptive'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the package(s) from their release tarballs and check them
        run: bash tools/checks/check-packages.sh /opt/ns-3 "${{ matrix.packages }}"
