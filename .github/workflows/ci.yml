name: CI

on:
  # Limit push to the default branch so PR branches run once (via the
  # pull_request event) instead of twice (push + pull_request). Both main and
  # master are listed so this works before/after the default-branch rename.
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A force-push to a PR branch obsoletes the in-flight run — cancel it instead
# of paying for the full matrix twice. Main-branch runs are never cancelled
# (cancel-in-progress is false there): every merge keeps its own complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# packages:read lets the container jobs pull the pre-built simulator images
# from GHCR; contents:read is for checkout.
permissions:
  contents: read
  packages: read

jobs:
  core:
    name: core library + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Build and test core
        run: make test

  core-sanitizers:
    name: core under ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Build core with sanitizers and run tests
        run: |
          cmake -S core -B core/build-san -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g"
          cmake --build core/build-san -j
          cd core/build-san && ctest --output-on-failure

  core-coverage:
    name: core test coverage (gcov, report-only)
    runs-on: ubuntu-latest
    # Which parts of core/ do the 18 ctest targets actually execute? The repo's
    # expensive failures (D2 evaporation, the #19 detector-D storm, the 8-bit
    # sequence wrap) were all behaviour in paths nothing exercised, so make that
    # answerable instead of intuited — and use it to aim new tests.
    #
    # Report-only on purpose (#162): there is deliberately **no --fail-under**
    # threshold here. Coverage is a map of untested paths, not a target; a floor
    # chosen before a baseline exists is either meaningless or an obstacle that
    # gets disabled the first time it bites. Observe the number across a few
    # merges, then pick a floor from evidence in a follow-up.
    #
    # No container/simulator: core/ builds standalone in seconds (golden rule 1).
    # Adapter coverage would mean instrumenting a containerized ns-3 build and is
    # out of scope.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Install toolchain
        # gcovr is pinned so the reported baseline stays comparable across
        # merges — its per-version gcov parsing shifts the numbers. The pin
        # lives in requirements-dev.txt so Dependabot can see it; bump it
        # there, noting the step change in the PR.
        run: |
          sudo apt-get update && sudo apt-get install -y cmake g++
          pip install -c requirements-dev.txt gcovr
      - name: Build core with gcov instrumentation
        run: |
          cmake -S core -B core/build-coverage -DCMAKE_BUILD_TYPE=Debug \
            -DANTHOCNET_COVERAGE=ON
          cmake --build core/build-coverage -j
      - name: Run the unit tests (emits the .gcda counters)
        run: cd core/build-coverage && ctest --output-on-failure
      - name: Report coverage of core/src + core/include
        # --exclude drops core/tests/ so the number measures coverage *of* the
        # core, not of the tests (which are ~100% by construction and would
        # dilute it). --txt gives the per-file table, --print-summary the overall
        # line/function/branch totals; both land in the job log, and the drill-
        # down HTML + Cobertura XML go to the artifact below.
        run: |
          mkdir -p coverage
          gcovr --root . core/build-coverage \
            --filter 'core/src/' --filter 'core/include/' \
            --exclude 'core/tests/' \
            --txt --print-summary \
            --html-details coverage/index.html \
            --xml-pretty --xml coverage/coverage.xml \
            --json-summary coverage/summary.json
      - name: Upload the detailed report (HTML + Cobertura XML)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-coverage-report
          path: coverage/
          retention-days: 14
      - name: Publish the line-coverage number to the badge gist
        # #333: the number existed only in a 14-day artifact, so a stranger
        # judging the repo never saw it. This pushes it to a gist that
        # shields.io renders as the README badge.
        #
        # Deliberately *not* Codecov, on trust footprint: Codecov needs a
        # third-party GitHub App installed with read access to the whole
        # repository, plus its uploader executing in this job with a token.
        # This repo SHA-pins every action (#338) and states its trust boundary
        # honestly (SECURITY.md), so the cheaper grant wins: a PAT with the
        # `gist` scope *only*, which can write one gist and cannot read or
        # write a single line of code. No new action either — a curl to the
        # documented gist API, so no third-party JS ever sees the token.
        #
        # #162 is untouched: this publishes the number, it does not judge it.
        # There is still no --fail-under anywhere in this job, and this step
        # cannot turn CI red — it exits 0 when the credentials are absent
        # (i.e. until the maintainer adds them) and is continue-on-error
        # otherwise, so a gist/API/network hiccup is reported, never fatal.
        #
        # Only on pushes to the default branch: PR runs (forks especially) get
        # no secrets, and the badge should track main, not a proposal.
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          # Maintainer setup (#333): a `gist`-scoped PAT as the GIST_TOKEN
          # secret, and the badge gist's id as the COVERAGE_GIST_ID variable.
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.COVERAGE_GIST_ID }}
        run: |
          if [ -z "$GIST_TOKEN" ] || [ -z "$GIST_ID" ]; then
            echo "GIST_TOKEN / COVERAGE_GIST_ID not configured — skipping the"
            echo "badge publish (see #333). Coverage still reported above."
            exit 0
          fi
          python3 - > payload.json <<'PY'
          import json
          pct = json.load(open("coverage/summary.json"))["line_percent"]
          color = next(c for floor, c in (
              (90, "brightgreen"), (80, "green"), (70, "yellowgreen"),
              (60, "yellow"), (50, "orange"), (0, "red")) if pct >= floor)
          badge = json.dumps({"schemaVersion": 1, "label": "coverage",
                              "message": f"{pct:.1f}%", "color": color})
          print(json.dumps({"files": {"anthocnet-coverage.json":
                                      {"content": badge}}}))
          PY
          curl --fail-with-body -sS -X PATCH \
            -H "Authorization: Bearer $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/gists/$GIST_ID" \
            -d @payload.json > /dev/null

  codec-fuzz:
    name: codec fuzz (libFuzzer, 60s)
    runs-on: ubuntu-latest
    # The codec is the only parser of untrusted network bytes (item 12), so fuzz
    # its decode path against a small seed corpus. ubuntu-latest's clang ships
    # the libFuzzer/ASan runtimes; a crash/UB/over-read fails the job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the codec fuzz target (clang + libFuzzer/ASan)
        run: |
          cmake -S core -B core/build-fuzz -DANTHOCNET_FUZZ=ON -DCMAKE_CXX_COMPILER=clang++
          cmake --build core/build-fuzz --target fuzz_codec
      - name: Fuzz the decode path for 60s
        run: |
          core/build-fuzz/tests/fuzz_codec -max_total_time=60 -print_final_stats=1 \
            core/tests/fuzz_corpus

  ns2-patch:
    name: NS-2 patch round-trip (synthetic tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate apply/revert against a synthetic ns-2 tree
        run: bash ns2/patch/selftest.sh

  ns2-compile:
    name: NS-2 adapter compile + e2e (real ns-2 tree)
    runs-on: ubuntu-latest
    # Compile the ns-2 adapter against a *real* ns-2 tree using the pre-built
    # plain ns-2 image (published to GHCR on merge to the default branch), then
    # run a small static AntHocNet simulation and assert it delivers data. This
    # is the only place the ns-2 agent is actually compiled *and exercised* — the
    # ns2-patch job above only checks that the patch applies/reverts on a
    # synthetic tree.
    #
    # We can't run this as a `container:` job: the ns-2 image is Ubuntu 18.04
    # (glibc 2.27) and the runner injects Node 24 (needs glibc 2.28+) to run
    # actions/checkout, which then fails. So check out on the host and run the
    # build via `docker run` inside the image (native bash, no Node needed).
    strategy:
      fail-fast: false
      matrix:
        version: ['2.34', '2.35']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile the adapter and run the e2e delivery smoke
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            ghcr.io/${{ github.repository_owner }}/ns2:${{ matrix.version }} \
            bash -euxc '
              make install-ns2 NS2DIR="$NS2DIR"
              cd "$NS2DIR"
              ./config.status
              make
              test -x ./ns
              # End-to-end: a static 3-node AntHocNet run must deliver CBR over
              # a forced 2-hop route (loose "routes data" gate, not performance).
              cp /src/ns2/tcl/ci-smoke.tcl .
              ./ns ci-smoke.tcl
              rx=$(grep -c "^r.*AGT.*cbr" ci-smoke.tr || true)
              echo "delivered CBR packets (rx at agent): $rx"
              [ "${rx:-0}" -gt 0 ]
            '
      - name: Re-run the e2e smoke under valgrind (memcheck)
        # Second pass of ci-smoke.tcl under valgrind to catch adapter-class
        # memory errors (the original NS-2 module's headline bugs). Only on
        # ns-2.35 to bound cost — valgrind slows the run ~20-50x and one tree
        # version is enough for calibration. A fresh `docker run` is needed
        # (the previous step's container is gone), but the image ships the
        # stock tree pre-built, so this only recompiles the adapter + relinks.
        # The image is Ubuntu 18.04, so valgrind comes from apt; the checkout
        # is mounted at /src, hence the /src/... suppressions path. Note
        # --leak-check=summary keeps leak *errors* off while calibrating
        # (only memcheck errors like invalid reads/writes fail the run);
        # tighten to --leak-check=full alongside promotion. Non-blocking —
        # promote to blocking once green on main (#130).
        if: matrix.version == '2.35'
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            ghcr.io/${{ github.repository_owner }}/ns2:${{ matrix.version }} \
            bash -euxc '
              apt-get update && apt-get install -y --no-install-recommends valgrind
              make install-ns2 NS2DIR="$NS2DIR"
              cd "$NS2DIR"
              ./config.status
              make
              test -x ./ns
              cp /src/ns2/tcl/ci-smoke.tcl .
              valgrind --error-exitcode=1 --errors-for-leak-kinds=definite \
                --leak-check=summary \
                --suppressions=/src/ns2/tools/valgrind.supp \
                ./ns ci-smoke.tcl
              rx=$(grep -c "^r.*AGT.*cbr" ci-smoke.tr || true)
              echo "delivered CBR packets under valgrind (rx at agent): $rx"
              [ "${rx:-0}" -gt 0 ]
            '

  ns3-build:
    name: NS-3 module build + test
    runs-on: ubuntu-latest
    # Build against the pre-built plain ns-3 image (published to GHCR on merge
    # to the default branch) rather than compiling ns-3 from scratch: the stock
    # tree is already built, so CI only compiles the AntHocNet module delta
    # (minutes instead of ~13 min/version). The image's gcc spans the whole
    # matrix (it builds 3.36..3.48 cleanly), so no per-version toolchain pin.
    #
    # Note: the images only (re)publish on merge to the default branch, so a
    # newly added ns-3 version must be added to images.yml and merged first.
    container:
      image: ghcr.io/${{ github.repository_owner }}/ns3:${{ matrix.version }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        # 3.36 = CMake-build baseline (widely used in published research);
        # 3.41/3.42 = prior pins; 3.47/3.48 = current releases. Spread catches
        # API drift across the whole supported range.
        version: ['3.36', '3.41', '3.42', '3.47', '3.48']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install AntHocNet module
        run: make install-ns3 NS3DIR=/opt/ns-3
      - name: Configure (scope examples/tests to AntHocNet)
        run: |
          cd /opt/ns-3
          # Build only AntHocNet's own examples/tests, not the stock modules'
          # (their cross-module deps drift by release). The filter flag scopes
          # that to our module; it was added after ns-3.36, so older trees just
          # build + smoke.
          mods='anthocnet;wifi;mobility;applications;csma;aodv;olsr;dsdv;flow-monitor;point-to-point'
          if ./ns3 configure --help 2>/dev/null | grep -q filter-module-examples-and-tests; then
            ./ns3 configure --enable-tests --enable-examples \
              --filter-module-examples-and-tests=anthocnet \
              --enable-modules="$mods"
            echo "RUN_TESTS=1" >> "$GITHUB_ENV"
          else
            ./ns3 configure --enable-examples --enable-modules="$mods"
            echo "RUN_TESTS=0" >> "$GITHUB_ENV"
          fi
      - name: Build
        run: cd /opt/ns-3 && ./ns3 build
      - name: Run module test suite (header round-trip + multi-hop delivery)
        if: env.RUN_TESTS == '1'
        run: cd /opt/ns-3 && ./test.py -s anthocnet
      - name: Smoke-run the example
        run: cd /opt/ns-3 && ./ns3 run anthocnet-example
      - name: E2E delivery smoke (AntHocNet must deliver in a connected scenario)
        # Loose behavioural gate: in a small, dense, connected scenario AntHocNet
        # must deliver *something* (catches "routes nothing" regressions, not
        # performance noise — that lives in the manual benchmarks). Parse the
        # AntHocNet PDR from the --csv output and require it to be > 0.
        run: |
          cd /opt/ns-3
          out=$(./ns3 run "anthocnet-compare --csv --protocols=anthocnet --nNodes=8 --time=20 --area=150 --flows=2" 2>/dev/null)
          echo "$out"
          pdr=$(printf '%s\n' "$out" | awk -F, '$1=="anthocnet"{print $7}')
          echo "AntHocNet PDR% = ${pdr:-<none>}"
          awk -v p="${pdr:-0}" 'BEGIN { exit (p+0 > 0) ? 0 : 1 }' \
            || { echo "FAIL: AntHocNet delivered no packets (PDR=${pdr:-<none>})"; exit 1; }
      - name: ISL-grid delivery smoke (#214 — multi-interface satellite shape)
        # The same loose "must deliver something" gate as above, on the topology
        # the satellite track needs (#192): a +Grid torus of point-to-point
        # links where every node holds 4 ISLs on 4 separate subnets. This is the
        # shape that the #203 multi-interface fix exists for, so a regression
        # there shows up here as zero delivery rather than only in a manual run.
        # Kept small (4x4, 30 s) so it costs a few seconds per matrix leg.
        run: |
          cd /opt/ns-3
          out=$(./ns3 run "isl-grid --csv --protocols=anthocnet --rows=4 --cols=4 --time=30 --flows=2" 2>/dev/null)
          echo "$out"
          pdr=$(printf '%s\n' "$out" | awk -F, '$1=="anthocnet"{print $9}')
          echo "AntHocNet ISL-grid PDR% = ${pdr:-<none>}"
          awk -v p="${pdr:-0}" 'BEGIN { exit (p+0 > 0) ? 0 : 1 }' \
            || { echo "FAIL: AntHocNet delivered no packets on the ISL grid (PDR=${pdr:-<none>})"; exit 1; }
      - name: Validation-anchor gate (single-hop PDR floor, #59)
        # Blocking anchor from docs/benchmarks/methodology.md "Validation
        # anchors": on a static, in-range 2-node link the *stock* stack
        # (manet-baselines, no AntHocNet code) must deliver ~100% — a #51-style
        # channel/rate-manager regression reads ~50% and used to go completely
        # undetected. Runs on
        # one matrix version to keep CI cheap (this reuses the job's build);
        # the heavier Broch-field anchor runs per-merge in benchmarks.yml.
        # Thresholds: ns3/tools/anchors.yml.
        if: matrix.version == '3.42'
        run: bash ns3/tools/check-anchors.sh /opt/ns-3 single-hop
      - name: Determinism gate (same seed twice must be byte-identical, #129)
        # Golden rule 3 (AGENTS.md): all randomness via IRng, all time via
        # IClock, so identical seeds must reproduce identical runs — the
        # property the per-protocol comparison on identical realisations rests
        # on. Runs anthocnet-compare twice with identical parameters and diffs
        # the per-protocol metric rows; a stray rand(), an uninjected
        # wall-clock read, or unordered-container iteration feeding a decision
        # fails here instead of silently invalidating every benchmark. Same
        # single-matrix-version placement as the anchor gate above to keep CI
        # cheap (reuses this job's build).
        if: matrix.version == '3.42'
        run: bash ns3/tools/check-determinism.sh /opt/ns-3
      - name: Seed-independence gate (a run must depend on its seed alone, #352)
        # Stronger than the determinism gate above: identical invocations were
        # already reproducible, but a run's realisation also leaked its
        # *position* in the process. ns-3 assigns RandomVariableStream indices
        # from a global counter at construction and SetSeed/SetRun do not reset
        # it, so before #352 the same seed produced different numbers depending
        # on --runs, --firstRun and protocol order — i.e. campaign CSVs merged
        # across differently-shaped invocations silently compared unlike runs.
        # Checks both halves: the same seeds split across invocations, and the
        # same seeds with --protocols reversed. 4 seeds x 30 simulated seconds
        # on the 8-node smoke field, so it costs seconds; same
        # single-matrix-version placement as the gates above.
        if: matrix.version == '3.42'
        run: python3 ns3/tools/check-seed-independence.py /opt/ns-3 --seeds 4 --time 30

      - name: Satellite validation anchors (#237, ISL topology)
        # The ISL analogue of the anchor gate above, and stronger in kind: a
        # point-to-point link has no contention and no loss model, so the
        # expected values are *analytic* rather than literature-derived.
        #   single-isl — 2 satellites, 1 ISL: PDR must be ~100% (the #51
        #                lesson applied to the p2p stack).
        #   hop-delay  — 4x4 torus, both flows 2 hops: mean delay must sit in
        #                [h*d, h*d + slack]. The lower bound is the sharp one —
        #                below it the packet beat propagation, so either the
        #                channel delay is not applied (#200) or the topology is
        #                not the 2-hop path it claims (#226).
        # Same single-matrix-version placement as the gates above (ADR-0015
        # also fixes satellite CI to one ns-3 version). Thresholds:
        # ns3/tools/anchors.yml.
        if: matrix.version == '3.42'
        run: |
          bash ns3/tools/check-sat-anchors.sh /opt/ns-3 single-isl
          bash ns3/tools/check-sat-anchors.sh /opt/ns-3 hop-delay
      - name: Determinism gate on the ISL topology (#237 S5)
        # Run separately from the wifi determinism gate rather than assuming it
        # follows: the ISL grid exercises a different device and channel, plus
        # the post-#203 multi-interface next-hop resolution whose peer map is
        # built from received hellos — an ordering a container-iteration bug
        # could perturb without ever showing on a single-interface wifi node.
        if: matrix.version == '3.42'
        run: bash ns3/tools/check-determinism.sh /opt/ns-3 isl-grid

  ns3-asan:
    name: NS-3 module under ASan + LSan
    runs-on: ubuntu-latest
    # Sanitize the adapter surface (pending-packet queue, timer cancel paths,
    # header <-> AntMessage conversion): rebuild the AntHocNet module and its
    # ns-3 dependencies with AddressSanitizer + LeakSanitizer, then re-run the
    # same module test suite and e2e delivery smoke as ns3-build. Single matrix
    # version (3.42, the anchor-gate pin) to bound cost. Non-blocking while the
    # LSan suppression file (ns3/tools/lsan.supp) is calibrated against
    # upstream ns-3 static/global allocations — promote to blocking once green
    # on main (#130).
    continue-on-error: true
    container:
      image: ghcr.io/${{ github.repository_owner }}/ns3:3.42
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # LeakSanitizer attaches to the process via ptrace at exit. The default
      # docker seccomp profile allows ptrace on current runners, but be
      # explicit so LSan can't start failing with "ptrace failed" after a
      # runner/docker update.
      options: --cap-add=SYS_PTRACE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install AntHocNet module
        run: make install-ns3 NS3DIR=/opt/ns-3
      - name: Configure with ASan/LSan
        run: |
          cd /opt/ns-3
          # Scope LSan failures to AntHocNet code: suppress known upstream ns-3
          # static-initializer allocations (see the file header for how to
          # extend it). $GITHUB_WORKSPACE is the in-container checkout path.
          echo "LSAN_OPTIONS=suppressions=$GITHUB_WORKSPACE/ns3/tools/lsan.supp" >> "$GITHUB_ENV"
          mods='anthocnet;wifi;mobility;applications;csma;aodv;olsr;dsdv;flow-monitor;point-to-point'
          # ns-3's CMake build has first-class sanitizer support (NS3_SANITIZE),
          # exposed by the ./ns3 wrapper as --enable-sanitizers
          # (address + leak + undefined). Prefer it when the wrapper advertises
          # it — it is re-applied on every configure, so it works on the image's
          # already-configured tree. Fallback: inject the flags via
          # CXXFLAGS/LDFLAGS, which ns-3's CMake only reads on a *fresh*
          # configure, hence the ./ns3 clean first (the flag change forces a
          # full rebuild either way). 3.42 has --filter-module-examples-and-tests
          # (added after 3.36), so tests always run here.
          if ./ns3 configure --help 2>/dev/null | grep -q enable-sanitizers; then
            ./ns3 configure --enable-sanitizers --enable-tests --enable-examples \
              --filter-module-examples-and-tests=anthocnet \
              --enable-modules="$mods"
          else
            ./ns3 clean
            CXXFLAGS='-fsanitize=address -fno-omit-frame-pointer -g' \
            LDFLAGS='-fsanitize=address' \
            ./ns3 configure --enable-tests --enable-examples \
              --filter-module-examples-and-tests=anthocnet \
              --enable-modules="$mods"
          fi
      - name: Build
        run: cd /opt/ns-3 && ./ns3 build
      - name: Run module test suite under ASan/LSan
        run: cd /opt/ns-3 && ./test.py -s anthocnet
      - name: E2E delivery smoke under ASan/LSan
        # Same loose "routes data" gate as ns3-build, but without ns3-build's
        # `2>/dev/null` so sanitizer reports land in the job log (command
        # substitution only captures stdout, so the CSV parse is unaffected).
        run: |
          cd /opt/ns-3
          out=$(./ns3 run "anthocnet-compare --csv --protocols=anthocnet --nNodes=8 --time=20 --area=150 --flows=2")
          echo "$out"
          pdr=$(printf '%s\n' "$out" | awk -F, '$1=="anthocnet"{print $7}')
          echo "AntHocNet PDR% = ${pdr:-<none>}"
          awk -v p="${pdr:-0}" 'BEGIN { exit (p+0 > 0) ? 0 : 1 }' \
            || { echo "FAIL: AntHocNet delivered no packets (PDR=${pdr:-<none>})"; exit 1; }
