name: Scenario matrix + charts (manual)

# Manually-dispatched: runs the scenario taxonomy + the paper's parameter sweeps
# (area/pause/scale) across all baselines, writes a classified CSV, and renders
# paper-style figures (line charts for sweeps, grouped bars for the named
# scenarios). Heavy, so it is not part of per-merge CI. Always uploads the CSV +
# PNGs as artifacts; optionally commits the regenerated charts into docs/.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'ns-3 image tag. Suffix -opt (e.g. 3.42-opt) selects the optimized-profile image — assertions/NS_LOG compiled out, typically 2-10x faster (#123). Use it for campaign runs; use the plain tag when you want assertions on.'
        default: '3.42'
      quick:
        description: 'Cheap preset (time=120, runs=2, 3 points/sweep)'
        type: boolean
        default: true
      runs:
        description: 'RNG runs to average (ignored if quick)'
        default: '5'
      time:
        description: 'Sim time per point (s) (ignored if quick)'
        default: '300'
      only:
        description: 'all | discrete | sweeps | <scenario/sweep name>'
        default: 'all'
      point:
        description: 'With only=<sweep name>: run just this one point (e.g. 1500 for area, 900 for pause, 1.4 for scale) instead of the whole sweep. Leave blank for the whole sweep.'
        default: ''
      runFirst:
        description: 'First RNG run (seed) of this dispatch (#126): seeds cover runFirst..runFirst+runs-1, so a point too big for the 6 h ceiling at full seed count splits across dispatches (e.g. runs=10 runFirst=1, then runs=10 runFirst=11). Pool the split CSVs with pool_runs.py. Leave blank for 1.'
        default: ''
      propagation:
        description: 'Propagation model override for every point: range (disk) | tworay. Leave blank for anthocnet-compare''s default (range).'
        default: ''
      extraArgs:
        description: 'Extra anthocnet-compare args appended verbatim to every point — mainly ns-3 attribute overrides, so protocol variants can be A/B''d from a dispatch instead of a branch per arm (#177). e.g. --ns3::anthocnet::RoutingProtocol::BetaData=20 --ns3::anthocnet::RoutingProtocol::EnableMultipath=false'
        default: ''
      commit:
        description: 'Commit regenerated charts + CSV into docs/ on this ref'
        type: boolean
        default: false

permissions:
  contents: write          # needed only when commit=true
  packages: read

jobs:
  matrix:
    name: scenario matrix + charts
    runs-on: ubuntu-latest
    # 6 h is a HARD platform ceiling on GitHub-hosted runners: every job is
    # killed at 360 min of execution, and jobs.<id>.timeout-minutes can only
    # *shorten* that, never extend it. (The 35-day limit is per workflow *run*;
    # the 5-day one is for self-hosted jobs.) A previous revision set 720 here
    # with a comment claiming it bought headroom — it did not: all four
    # whole-sweep runs of the first campaign died at ~360 min regardless (#121).
    # So this is set to the truth, not to a wish.
    #
    # Consequence for callers: a real (non-quick) whole sweep does NOT fit. One
    # point at runs=5/time=900 measures well over an hour, so a 4-5-point sweep
    # exceeds 6 h. Dispatch such sweeps **one point per job** using the
    # only=<sweep name> + point=<value> inputs (#120), or run them off-Actions.
    timeout-minutes: 360
    container:
      image: ghcr.io/${{ github.repository_owner }}/ns3:${{ github.event.inputs.version }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install AntHocNet module
        run: make install-ns3 NS3DIR=/opt/ns-3
      - name: Resolve ns-3 build profile (#123)
        # The reconfigure below must NOT silently downgrade an optimized image
        # back to the default profile — that would quietly hand back the 2-10x
        # speedup the -opt image exists for, and nothing in the results would
        # say so. ns-3's `ns3 configure` only omits -DCMAKE_BUILD_TYPE (and so
        # inherits the cached profile) while the tree is still "configured"; the
        # moment that stops holding, the profile resets to `default`. So state
        # it explicitly instead of relying on that inheritance.
        #
        # Source of truth is NS3_PROFILE, baked into the image env by
        # docker/Dockerfile.ns3 — it travels with the image, so it stays right
        # if the tag is renamed, mirrored or pinned to a release. Images built
        # before #123 have no such env, hence the tag-suffix fallback.
        env:
          VERSION_TAG: ${{ github.event.inputs.version }}
        run: |
          profile="${NS3_PROFILE:-}"
          if [ -z "$profile" ]; then
            case "$VERSION_TAG" in
              *-opt) profile=release ;;
              *)     profile=default ;;
            esac
            echo "image has no NS3_PROFILE env (pre-#123 image); inferred from tag '$VERSION_TAG'"
          fi
          # Empty for `default`: keeps the configure line byte-identical to the
          # pre-#123 one on the default images.
          flag=""
          [ "$profile" = "default" ] || flag="-d $profile"
          echo "ns-3 build profile: $profile (configure flag: '${flag:-<none>}')"
          echo "NS3_PROFILE=$profile" >> "$GITHUB_ENV"
          echo "NS3_PROFILE_FLAG=$flag" >> "$GITHUB_ENV"
      - name: Configure + build
        run: |
          cd /opt/ns-3
          # $NS3_PROFILE_FLAG unquoted on purpose: empty must expand to nothing.
          ./ns3 configure $NS3_PROFILE_FLAG --enable-examples \
            --enable-modules='anthocnet;wifi;mobility;applications;csma;aodv;olsr;dsdv;flow-monitor;point-to-point'
          ./ns3 build
          # Recorded in the log so every campaign run is attributable to a
          # profile after the fact (a run's cost is meaningless without it).
          ./ns3 show profile
      - name: Install matplotlib
        run: apt-get update && apt-get install -y python3-matplotlib
      - name: Run scenario matrix
        # Step-level timeout, ~20 min under the platform's 6 h job kill, so the
        # abort is one WE control: only this step is marked failed and the
        # always() render/upload steps below still run, preserving the
        # per-point-flushed partial scenarios.csv (#119). Waiting for the
        # platform kill instead would end the whole job with no further steps.
        timeout-minutes: 340
        run: |
          quick=""
          [ "${{ github.event.inputs.quick }}" = "true" ] && quick="--quick"
          propagation=""
          if [ -n "${{ github.event.inputs.propagation }}" ]; then
            propagation="--propagation=${{ github.event.inputs.propagation }}"
          fi
          point=""
          if [ -n "${{ github.event.inputs.point }}" ]; then
            point="--point=${{ github.event.inputs.point }}"
          fi
          runfirst=""
          if [ -n "${{ github.event.inputs.runFirst }}" ]; then
            runfirst="--run-first=${{ github.event.inputs.runFirst }}"
          fi
          # #177: extraArgs must reach anthocnet-compare as ONE argv element
          # here, so it is quoted — unlike $quick/$propagation/$point above,
          # which are single tokens deliberately left unquoted to expand to
          # nothing when empty. run-scenarios.py splices the string into its
          # `./ns3 run "anthocnet-compare ..."` command line, where the shell
          # word-splits it — the same place paper-benchmark.yml's extraArgs is
          # split, so multi-argument values behave identically in both
          # workflows. Empty is the default and is a no-op.
          python3 ns3/tools/run-scenarios.py /opt/ns-3 \
            --out "$GITHUB_WORKSPACE/scenarios.csv" \
            --runs "${{ github.event.inputs.runs }}" \
            --time "${{ github.event.inputs.time }}" \
            --only "${{ github.event.inputs.only }}" \
            --extra-args "${{ github.event.inputs.extraArgs }}" \
            $quick $propagation $point $runfirst
      - name: Render charts
        # always(): a mid-sweep failure (one anthocnet-compare invocation
        # raising SystemExit) still leaves a valid, closed CSV for whatever
        # points completed before it — try to chart it rather than skip.
        if: always()
        run: |
          python3 ns3/tools/make-charts.py "$GITHUB_WORKSPACE/scenarios.csv" \
            --outdir "$GITHUB_WORKSPACE/docs/benchmarks"
      - name: Provenance line (#365)
        # always(): a sweep that died mid-way still produced numbers for the
        # points that completed, and those numbers need their commit just as
        # much as a clean run's do.
        #
        # This workflow has no compact result block — its numbers travel as a
        # CSV artifact, not as log rows — so ##PROV## is its own step here
        # rather than a tail line. Same contract as paper-benchmark.yml: the
        # commit is knowable only to the workflow, and the run-ID-to-commit
        # mapping the Actions API would otherwise supply disappears when the
        # run's logs expire.
        if: always()
        run: |
          echo "##PROV## commit=$GITHUB_SHA ref=$GITHUB_REF_NAME run_id=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT image=ghcr.io/${{ github.repository_owner }}/ns3:${{ github.event.inputs.version }} profile=$NS3_PROFILE harness=scenario-matrix only=${{ github.event.inputs.only }}"
      - name: Upload CSV + charts
        # always(): upload whatever CSV/charts exist even if an earlier step
        # failed, so a mid-sweep abort doesn't lose the completed points —
        # including the 340-min step timeout above, which is deliberately set
        # below the 6 h job ceiling precisely so this step still gets to run.
        # (A *job*-level timeout, ours or the platform's hard 360-min one,
        # kills everything with no further steps; that is what we avoid.)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scenario-matrix
          path: |
            scenarios.csv
            scenarios-runs.csv
            docs/benchmarks/*.png
          retention-days: 7
          if-no-files-found: warn
      - name: Commit charts into docs (optional)
        if: ${{ github.event.inputs.commit == 'true' }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/scenarios.csv" docs/benchmarks/scenarios.csv
          git add docs/benchmarks
          if git diff --cached --quiet; then
            echo "no chart changes to commit"
          else
            git commit -m "benchmarks: regenerate scenario matrix charts [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
