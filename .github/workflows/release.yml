name: Release

# Manual, Commitizen-driven release. You trigger it; Commitizen computes the
# next SemVer from the Conventional-Commit history since the last tag (feat ->
# minor, fix -> patch, breaking -> minor while 0.x), rewrites the version in
# VERSION / CITATION.cff / core CMake, regenerates CHANGELOG.md, commits + tags,
# then this same job builds the lean install bundle, checksums it, and publishes
# the GitHub Release. Bump + release live in one job on purpose: a tag pushed
# with the default GITHUB_TOKEN does NOT trigger other workflows, so we don't
# rely on the tag event (and need no PAT). Once the repo is linked to Zenodo,
# each published release is archived + gets a DOI; add it to CITATION.cff
# afterwards.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "bump = cz computes next version from commits; baseline = release the current VERSION as-is (use once, for v0.1.0); dryrun = bump, build, attest and verify on the runner, then stop: nothing is pushed or published (#614)"
        type: choice
        options: [bump, baseline, dryrun]
        default: bump

permissions:
  contents: write      # push the bump commit/tag and create the release
  id-token: write      # keyless Sigstore signing of the attestations (#614)
  attestations: write  # store build provenance + SBOM attestations (#614)

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags for cz to compute the bump

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Install tools
        # commitizen is pinned in requirements-dev.txt: it computes the semver
        # bump from commit history and rewrites the version strings, and this
        # workflow is never exercised by PR CI, so a float would first be
        # noticed as a wrong release number.
        #
        # cmake and g++ come with the GitHub-hosted Ubuntu image, so there is
        # no apt step: on 2026-10-07 `apt-get update` hung on the Ubuntu
        # archive for 26+ minutes in two consecutive v1.9.0 release runs
        # (37673285198, 37681037542), before anything was committed or tagged.
        # The version checks fail fast if a future image drops either tool, and
        # the timeout bounds any other hang here.
        timeout-minutes: 10
        run: |
          pip install -c requirements-dev.txt commitizen
          cmake --version
          g++ --version

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute version (bump or baseline)
        id: compute
        run: |
          if [ "${{ inputs.mode }}" = "baseline" ]; then
            ver="$(tr -d '[:space:]' < VERSION)"
            git tag -a "v${ver}" -m "v${ver}"
          else
            # cz rewrites `version:` in CITATION.cff but not the release date, so
            # stamp today's date first: cz then `git add`s the whole file and the
            # bump commit (and its tag) carry the correct date-released.
            sed -i -E "s/^date-released:.*/date-released: \"$(date -u +%Y-%m-%d)\"/" CITATION.cff
            cz bump --yes --changelog
            ver="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "VER=${ver}" >> "$GITHUB_ENV"
          echo "TAG=v${ver}" >> "$GITHUB_ENV"
          echo "tag=v${ver}" >> "$GITHUB_OUTPUT"   # for the images job

      - name: Sanity build + test (core)
        run: make test

      - name: Check the package contents
        # The same gate CI runs on PRs (#604): no agent files, no caches, the
        # shipped tools' dependencies present, git archive clean.
        run: tools/release/check-bundle.sh

      - name: Assemble install bundle
        # One definition of what ships, shared with the gate above (#604).
        run: |
          name="anthocnet-${VER}"
          tools/release/assemble-bundle.sh "$VER" dist
          ( cd dist && zip -qr "${name}.zip" "${name}" )
          ls -lh "dist/${name}.zip"

      - name: Checksum the bundle
        # Zero-dependency integrity signal (#337). `sha256sum` writes the
        # canonical "<digest>  <name>" line, so the .sha256 file is directly
        # consumable by `sha256sum -c` in the directory the zip was downloaded
        # to — hence the subshell: the recorded name must be bare, not "dist/…".
        # The digest is *also* inlined in the release body below, so a reader
        # can check a download against the release page without having to trust
        # a second downloaded file.
        run: |
          ( cd dist && sha256sum "anthocnet-${VER}.zip" > "anthocnet-${VER}.zip.sha256" )
          cat "dist/anthocnet-${VER}.zip.sha256"
          echo "SHA256=$(cut -d' ' -f1 < "dist/anthocnet-${VER}.zip.sha256")" >> "$GITHUB_ENV"

      - name: Build the drop-in ns-3 module tarball (#606)
        # The four contrib modules exactly as `make install-ns3` lays them out,
        # so a user without a checkout runs one `tar -xzf … -C ns-3/contrib`.
        # Deterministic (sorted, fixed owner/mtime, gzip -n).
        run: |
          tools/release/module-tarball.sh "$VER" dist
          ( cd dist && sha256sum "anthocnet-ns3-modules-${VER}.tar.gz" > "anthocnet-ns3-modules-${VER}.tar.gz.sha256" )
          cat "dist/anthocnet-ns3-modules-${VER}.tar.gz.sha256"
          echo "MOD_SHA256=$(cut -d' ' -f1 < "dist/anthocnet-ns3-modules-${VER}.tar.gz.sha256")" >> "$GITHUB_ENV"

      - name: Bake recipe for this release (#613)
        # ns-3's own installer: the module tarball above as an ns-contrib
        # module. bake.yml tests the same template against a served tarball.
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/anthocnet-ns3-modules-${VER}.tar.gz"
          sed -e "s|@URL@|${url}|" -e "s|@VERSION@|${VER}|" packaging/bake/anthocnet.xml.in \
            > "dist/anthocnet-${VER}.bakeconf.xml"

      - name: SBOM of the install bundle (#614)
        # SPDX JSON of what ships: the unpacked bundle directory that the zip
        # is made from, so the SBOM describes exactly the released files.
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist/anthocnet-${{ env.VER }}
          format: spdx-json
          output-file: dist/anthocnet-${{ env.VER }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance (#614)
        # SLSA provenance for both downloads, signed keylessly with this
        # workflow's OIDC identity and stored in GitHub's attestation store.
        # The Sigstore bundle is also attached to the release, so it can be
        # checked offline and Scorecard's Signed-Releases check finds it.
        # actions/attest itself, not the attest-build-provenance wrapper
        # (CONTRIBUTING.md, "Provenance": the wrapper's own README points here).
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/anthocnet-${{ env.VER }}.zip
            dist/anthocnet-ns3-modules-${{ env.VER }}.tar.gz

      - name: Attest the SBOM (#614)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/anthocnet-${{ env.VER }}.zip
          sbom-path: dist/anthocnet-${{ env.VER }}.spdx.json

      - name: Verify what was just attested (#614)
        # The same commands SECURITY.md gives users, run before publishing: a
        # release whose attestations do not verify never goes out.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" "dist/anthocnet-${VER}.provenance.sigstore.json"
          for f in "dist/anthocnet-${VER}.zip" "dist/anthocnet-ns3-modules-${VER}.tar.gz"; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
          spdx=$(jq -r '.spdxVersion | sub("^SPDX-"; "")' "dist/anthocnet-${VER}.spdx.json")   # e.g. 2.3
          gh attestation verify "dist/anthocnet-${VER}.zip" --repo "$GITHUB_REPOSITORY" --predicate-type "https://spdx.dev/Document/v${spdx}"

      - name: Push commit + tag
        if: ${{ inputs.mode != 'dryrun' }}
        # After the bundle is built, attested and verified (#614): if any of
        # that fails, nothing has been pushed, so there is no tagged-but-
        # unreleased version to clean up by hand.
        run: |
          git push origin HEAD:main
          git push origin "${TAG}"

      - name: Update the generated ns3-module branch (#606)
        if: ${{ inputs.mode != 'dryrun' }}
        # The tarball's contents as an orphan commit on `ns3-module`, replaced
        # on every release, for users who prefer git over a download:
        #   git clone -b ns3-module --depth 1 <repo> m && cp -r m/* ns-3/contrib/
        # Built in a scratch index so the workspace and its history are not
        # touched; pushed with the checkout's own credentials.
        run: |
          tmp=$(mktemp -d)
          tar -xzf "dist/anthocnet-ns3-modules-${VER}.tar.gz" -C "$tmp"
          export GIT_INDEX_FILE="$(mktemp -u)"
          git read-tree --empty
          git --work-tree="$tmp" add -A
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "AntHocNet ${TAG}: drop-in ns-3 modules (generated by release.yml; do not edit)")
          git push --force origin "${commit}:refs/heads/ns3-module"

      - name: Publish release
        if: ${{ inputs.mode != 'dryrun' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/anthocnet-${{ env.VER }}.zip
            dist/anthocnet-${{ env.VER }}.zip.sha256
            dist/anthocnet-ns3-modules-${{ env.VER }}.tar.gz
            dist/anthocnet-ns3-modules-${{ env.VER }}.tar.gz.sha256
            dist/anthocnet-${{ env.VER }}.spdx.json
            dist/anthocnet-${{ env.VER }}.bakeconf.xml
            dist/anthocnet-${{ env.VER }}.provenance.sigstore.json
          generate_release_notes: true
          body: |
            AntHocNet ${{ env.TAG }}. Release notes: https://danieljoppi.github.io/AntHocNet/docs/releases/${{ env.TAG }}/
            (from [CHANGELOG.md](https://github.com/danieljoppi/AntHocNet/blob/${{ env.TAG }}/CHANGELOG.md); the site redeploys when this run finishes).

            **Install bundle** (`anthocnet-${{ env.VER }}.zip`) — the source to
            drop onto your own simulator tree:
            `make doctor NS3DIR=…` then `make install-ns3 NS3DIR=…`
            (`BASELINES=0` for AntHocNet alone).

            **Drop-in ns-3 modules** (`anthocnet-ns3-modules-${{ env.VER }}.tar.gz`):
            no checkout needed, `tar -xzf anthocnet-ns3-modules-${{ env.VER }}.tar.gz -C /path/to/ns-3/contrib`,
            then configure and build ns-3. The same files are on the generated
            `ns3-module` branch. SHA-256: `${{ env.MOD_SHA256 }}`.
            **With bake** (ns-3's installer): copy `anthocnet-${{ env.VER }}.bakeconf.xml`
            into your bake checkout's `contrib/`, then
            `./bake.py configure -e ns-3.42 -e anthocnet && ./bake.py download && ./bake.py build`.

            Pre-built simulator images are on GHCR (see `docker/README.md`),
            including release-pinned tags `anthocnet-ns3:<sim-version>-${{ env.TAG }}`.

            **Verify your download.** The SHA-256 digest is published twice — in
            this body and as the `anthocnet-${{ env.VER }}.zip.sha256` asset:

            ```
            ${{ env.SHA256 }}  anthocnet-${{ env.VER }}.zip
            ```

            ```
            sha256sum -c anthocnet-${{ env.VER }}.zip.sha256   # both files in the same directory
            ```

            **Verify where it came from.** Both downloads carry signed SLSA
            build provenance, and the bundle an SPDX SBOM
            (`anthocnet-${{ env.VER }}.spdx.json`). With the GitHub CLI:

            ```
            gh attestation verify anthocnet-${{ env.VER }}.zip --repo ${{ github.repository }}
            ```

            The images are signed with cosign (keyless). See
            [SECURITY.md](https://github.com/${{ github.repository }}/blob/${{ env.TAG }}/SECURITY.md#verifying-a-release).

  # Publish immutable, release-pinned container images (e.g.
  # anthocnet-ns3:3.42-v0.3.0) once the tag exists. Reuses the Images workflow
  # via workflow_call — a direct job dependency, so the tag the release job just
  # pushed with GITHUB_TOKEN is picked up without a PAT.
  images:
    needs: release
    if: ${{ inputs.mode != 'dryrun' }}
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
      id-token: write      # cosign keyless signing + provenance (#614)
      attestations: write
    with:
      release: ${{ needs.release.outputs.tag }}
