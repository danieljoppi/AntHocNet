name: Pages

# Publishes three builds as one GitHub Pages artifact (#331, #542): the learn
# site -- core/ compiled to WebAssembly plus its front end (#545-#548) -- as
# the front page at /, docs/ rendered by mkdocs-material at /docs/, and the
# Doxygen API reference at /api/ (#543). Stubs at the old docs URLs and at
# /learn/ forward to the new ones (ADR-0021, amendment 2026-10-09). The repository
# tree stays canonical -- this job only renders it, so a failure here never
# blocks a merge; ci.yml/lint.yml remain the gates (ci.yml's web-parity job
# runs the same WASM build and the learn-site smoke on every PR).
on:
  push:
    branches: [main]
    # Every input of the three builds: the docs, the headers Doxygen reads,
    # and the core + adapter + front end the learn site compiles.
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'api/**'
      - 'core/**'
      - 'ns3/model/*.h'
      - 'ns3/helper/*.h'
      - 'web/**'
      - 'VERSION'
      - '.github/workflows/pages.yml'
  # The bots that refresh published results push with GITHUB_TOKEN, and a
  # GITHUB_TOKEN push never triggers another workflow -- so the push trigger
  # above cannot see them, and the live site kept serving the previous
  # tables and charts until the next human merge touched docs/. Redeploy
  # whenever one of those workflows finishes on main. A run that committed
  # nothing just redeploys the same tree, which is harmless.
  workflow_run:
    workflows: ["Benchmarks", "Charts", "Scenario matrix + charts (manual)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Least privilege: the build reads the tree, the deploy needs `pages: write`
# plus the OIDC token (`id-token: write`) that actions/deploy-pages exchanges
# for the Pages deployment credential. Nothing here writes to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; a superseded run is *not* cancelled
# (cancel-in-progress: false) so an in-flight publish always finishes and the
# site never lands half-deployed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    # After a refresh workflow, deploy only if it succeeded (a failed
    # benchmark run commits nothing, so there is nothing new to publish).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      # Every action is SHA-pinned with the tag in a trailing comment, matching
      # the repo-wide pinning done in #338: a tag is a moving pointer, so an
      # unpinned action lets a third party change what runs in a job that holds
      # `pages: write` and an OIDC token. checkout/setup-python reuse the exact
      # SHAs already pinned in ci.yml and lint.yml.
      # On workflow_run this checks out the default branch's tip, which
      # includes the bot's refresh commit -- the state to publish.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Install emsdk (pinned, as ci.yml)
        run: |
          git clone --depth 1 --branch 4.0.10 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.10
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.10
      - name: Learn site (the front page, /)
        # First: build-site.sh empties its output directory.
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          web/build-site.sh site
      - name: Install mkdocs-material
        # Pinned for the same reason ruff is pinned in lint.yml: an unpinned
        # docs toolchain turns an upstream release into a red main-branch run.
        # The pin lives in requirements-dev.txt so Dependabot can see it.
        run: pip install -c requirements-dev.txt mkdocs-material
      - name: Docs (/docs/)
        # --strict: warnings (broken internal links, nav pointing at a missing
        # page) fail the build instead of silently shipping a 404. It passes
        # today; keep it passing rather than dropping the flag.
        run: mkdocs build --strict --site-dir site/docs
      - name: API reference (/api/)
        # Doxygen from the runner's apt (1.9.8 on ubuntu-24.04), version logged.
        # Undocumented public symbols are reported, not fatal (#543).
        run: |
          sudo apt-get install -y --no-install-recommends doxygen >/dev/null
          doxygen --version
          mkdir -p build/api
          AHN_VERSION="$(cat VERSION)" doxygen api/Doxyfile
          cp -r build/api/html site/api
      - name: Redirects from the old URLs (/<page>/ -> /docs/<page>/, /learn/ -> /)
        run: web/site-redirects.sh site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
