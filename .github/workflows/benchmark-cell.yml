name: Benchmark cell

# One benchmark workflow for every harness (#612). It runs one cell (one
# harness invocation, any number of seeds) and, if asked, opens a PR that
# adds the cell to results/cells/ with its provenance and its scenario_check
# verdict. That replaces the "save the artifact, rebuild the provenance,
# commit by hand" loop.
#
# Every dispatch shape of the older workflows (removed in v2.5.0, #746) fits
# here, because `args` is the harness's own command line:
#   paper-benchmark.yml      harness=anthocnet-compare, args = its flags
#                            (--scenario=paper --runs=20 ... --diag)
#   satellite-benchmark.yml  harness=isl-grid | leo-walker, args = the flags
#                            those inputs expanded to, plus extraArgs
#   scenario-matrix.yml      one dispatch per sweep point; a sweep is a set
#                            of cells (tools/bench/campaign.py dispatches sets)
# campaign.py translates committed plans that still name the old workflows
# into these inputs. rescue-artifacts.yml is recovery, not a dispatch shape,
# and stays.
#
# The bot PR is opened with a GitHub App installation token when the
# repository has one configured (#705): variable AHN_BOT_APP_ID and secret
# AHN_BOT_APP_KEY, for an app with contents: write and pull-requests: write
# on this repository. Pushes and PRs made with an app token start the normal
# PR workflows, so the cell PR gets CI (lint, the replay check) and can
# auto-merge (#616). Without them the job falls back to the workflow's own
# token, with two consequences:
# - it needs the repository setting "Allow GitHub Actions to create and
#   approve pull requests"; without it the branch is still pushed, and the
#   job summary links it;
# - CI does not run on a PR a workflow token opens; close and reopen it if a
#   check is wanted. The job prints a notice saying so.
on:
  workflow_dispatch:
    inputs:
      harness:
        description: 'anthocnet-compare (MANET/mesh/FANET/VANET) | isl-grid | leo-walker (ns-3 >= 3.48)'
        type: choice
        options: [anthocnet-compare, isl-grid, leo-walker]
        default: anthocnet-compare
      args:
        description: 'The harness flags, verbatim (e.g. --scenario=paper --runs=20 --protocols=anthocnet,aodv,olsr,dsdv,oracle --diag)'
        required: true
      version:
        description: 'ns-3 image tag (3.42-opt for campaigns; 3.48 for leo-walker)'
        default: '3.42-opt'
      cell:
        description: 'Cell name: the PR adds results/cells/<cell>.txt (required with open_pr)'
        default: ''
      title:
        description: "One line for the cell's header, e.g. 'static mesh (paper field, pause=900, disk) 20 seeds'"
        default: ''
      replay:
        description: 'ns-3 replay id (#641: manet, mesh, fanet, vanet, isl, leo): also record the first anthocnet run with --vizTrace; the PR adds results/replay/<id>.jsonl'
        default: ''
      published:
        description: 'With replay: the published cell the trace must match (results/cells/<name>.txt, checked by check-viz-trace.py)'
        default: ''
      open_pr:
        description: 'Open a PR adding the cell and/or the replay trace (with provenance and the checks)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  run:
    name: ${{ inputs.harness }} ${{ inputs.cell }}
    runs-on: ubuntu-latest
    timeout-minutes: 360   # the hosted-runner ceiling (#121)
    container:
      image: ghcr.io/${{ github.repository_owner }}/ns3:${{ inputs.version }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the inputs
        env:
          CELL: ${{ inputs.cell }}
          REPLAY: ${{ inputs.replay }}
          OPEN_PR: ${{ inputs.open_pr }}
        run: |
          for v in "$CELL" "$REPLAY"; do
            if [ -n "$v" ] && ! printf '%s' "$v" | grep -qE '^[a-z0-9][a-z0-9.-]*$'; then
              echo "names must be [a-z0-9.-] (got '$v')"; exit 1
            fi
          done
          if [ "$OPEN_PR" = "true" ] && [ -z "$CELL$REPLAY" ]; then
            echo "open_pr needs a cell and/or a replay name"; exit 1
          fi
      - name: Install AntHocNet module
        run: make install-ns3 NS3DIR=/opt/ns-3
      - name: Resolve ns-3 build profile (#123)
        # State the image's profile
        # explicitly, so the reconfigure never downgrades an -opt image.
        env:
          VERSION_TAG: ${{ inputs.version }}
        run: |
          profile="${NS3_PROFILE:-}"
          if [ -z "$profile" ]; then
            case "$VERSION_TAG" in *-opt) profile=release ;; *) profile=default ;; esac
          fi
          flag=""
          [ "$profile" = "default" ] || flag="-d $profile"
          echo "ns-3 build profile: $profile"
          echo "NS3_PROFILE=$profile" >> "$GITHUB_ENV"
          echo "NS3_PROFILE_FLAG=$flag" >> "$GITHUB_ENV"
      - name: Configure and build
        run: |
          cd /opt/ns-3
          # $NS3_PROFILE_FLAG unquoted on purpose: empty must expand to nothing.
          ./ns3 configure $NS3_PROFILE_FLAG --enable-examples \
            --enable-modules='anthocnet;aomdv;gpsr;oracle;adaptive;wifi;mobility;applications;csma;aodv;olsr;dsdv;flow-monitor;point-to-point;mesh'
          ./ns3 build && ./ns3 show profile
      - name: Run the cell
        # Stop the run 20 min before the job ceiling, so
        # the always() steps still upload the stderr tail and a stub results
        # file that campaign.py collect recognises as a missing run (#746).
        timeout-minutes: 340
        shell: bash
        env:
          HARNESS: ${{ inputs.harness }}
          ARGS: ${{ inputs.args }}
          REPLAY: ${{ inputs.replay }}
        run: |
          cd /opt/ns-3
          set -o pipefail
          [ -n "$REPLAY" ] && ARGS="$ARGS --vizTrace=$GITHUB_WORKSPACE/replay.jsonl"
          timewrap=""
          [ -x /usr/bin/time ] && timewrap="/usr/bin/time -v -o $GITHUB_WORKSPACE/time-v.log"
          # #256: cap the address space below the
          # runner's, so an over-large cell dies by bad_alloc and keeps its logs.
          ulimit -v 13631488 || true
          echo "running: $HARNESS $ARGS"
          $timewrap ./ns3 run "$HARNESS $ARGS" 2>"$GITHUB_WORKSPACE/ns3-stderr.log" \
            | tee "$GITHUB_WORKSPACE/results.txt" \
            || { echo "--- ns-3 run FAILED; stderr tail ---"; tail -n 60 "$GITHUB_WORKSPACE/ns3-stderr.log"; exit 1; }
      - name: Stamp provenance into the results file (#674)
        if: always()
        shell: bash
        env:
          HARNESS: ${{ inputs.harness }}
          ARGS: ${{ inputs.args }}
        run: |
          prov="##PROV## commit=$GITHUB_SHA ref=$GITHUB_REF_NAME run_id=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT image=ghcr.io/${{ github.repository_owner }}/ns3:${{ inputs.version }} profile=$NS3_PROFILE harness=$HARNESS"
          echo "AHN_PROV=$prov" >> "$GITHUB_ENV"
          if [ -f "$GITHUB_WORKSPACE/results.txt" ]; then
            echo "##ARGS## $HARNESS $ARGS" >> "$GITHUB_WORKSPACE/results.txt"
            echo "$prov" >> "$GITHUB_WORKSPACE/results.txt"
          fi
      - name: scenario_check verdict
        if: always()
        shell: bash
        run: |
          [ -f "$GITHUB_WORKSPACE/results.txt" ] || exit 0
          python3 tools/bench/scenario_check.py results "$GITHUB_WORKSPACE/results.txt" \
            | tee "$GITHUB_WORKSPACE/verdict.txt"
      - name: Check the replay trace against the published cell (#641)
        if: ${{ inputs.replay != '' }}
        shell: bash
        env:
          PUBLISHED: ${{ inputs.published }}
        run: |
          cell=""
          [ -n "$PUBLISHED" ] && cell="--cell results/cells/${PUBLISHED}.txt"
          # $cell unquoted on purpose: empty must expand to nothing.
          python3 tools/bench/check-viz-trace.py "$GITHUB_WORKSPACE/replay.jsonl" $cell \
            | tee "$GITHUB_WORKSPACE/replay-check.txt"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-cell
          path: |
            results.txt
            verdict.txt
            replay.jsonl
            replay-check.txt
            ns3-stderr.log
            time-v.log
          retention-days: 30
      - name: Compact result block (cheap to fetch via get_job_logs tail)
        if: always()
        shell: bash
        run: |
          f="$GITHUB_WORKSPACE/results.txt"
          [ -f "$f" ] || { echo "FAIL: no results file"; exit 1; }
          grep -E '^(##RUN##|##BENCH##|protocol|[a-z][a-z-]+ +[0-9])' "$f" | tail -n 40 || true
          if ! grep -qE '^(##RUN##|[a-z][a-z-]+ +[0-9])' "$f"; then
            echo "FAIL: no result rows (#28)"; exit 1
          fi
          tail -n 1 "$GITHUB_WORKSPACE/verdict.txt" 2>/dev/null || true
          echo "$AHN_PROV"

  pr:
    name: Open a PR with the cell
    needs: run
    if: ${{ inputs.open_pr }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # #705: an app token, when configured, so the PR's push starts CI.
      - name: GitHub App token
        id: app
        if: ${{ vars.AHN_BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ vars.AHN_BOT_APP_ID }}
          private-key: ${{ secrets.AHN_BOT_APP_KEY }}
      - name: Token notice
        if: ${{ steps.app.outputs.token == '' }}
        run: echo "::notice::No AHN_BOT_APP_ID/AHN_BOT_APP_KEY configured (#705); the PR is opened with GITHUB_TOKEN and CI will not run on it."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-cell
          path: ${{ runner.temp }}/cell
      - name: Commit the cell on a branch and open the PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token != '' }}
          CELL: ${{ inputs.cell }}
          REPLAY: ${{ inputs.replay }}
          TITLE: ${{ inputs.title }}
          HARNESS: ${{ inputs.harness }}
          ARGS: ${{ inputs.args }}
          VERSION: ${{ inputs.version }}
        run: |
          dir="$RUNNER_TEMP/cell"
          name="${CELL:-replay-${REPLAY}}"
          branch="bench/${name}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          added=""
          if [ -n "$CELL" ]; then
            # The cell format the pages cite: a one-line header, then the
            # harness output (its ##CONFIG##/##RUN## rows), then ##ARGS##/##PROV##.
            dest="results/cells/${CELL}.txt"
            { echo "# ${TITLE:-$CELL} @${GITHUB_SHA:0:8} run ${GITHUB_RUN_ID} (benchmark-cell.yml, #612)"
              cat "$dir/results.txt"; } > "$dest"
            git add "$dest"; added="\`${dest}\`"
          fi
          if [ -n "$REPLAY" ]; then
            mkdir -p results/replay
            cp "$dir/replay.jsonl" "results/replay/${REPLAY}.jsonl"
            git add "results/replay/${REPLAY}.jsonl"; added="${added:+$added and }\`results/replay/${REPLAY}.jsonl\`"
          fi
          # A re-recorded result can equal what main already holds (v2.3.0's
          # VANET replay: quiet mode never engages on that seed, so the run is
          # byte-identical). Nothing to propose then; say so and stop green.
          if git diff --cached --quiet; then
            echo "::notice::${added} unchanged: main already holds this run byte for byte; no PR opened"
            exit 0
          fi
          git commit -q -m "docs(bench): add ${name} (run ${GITHUB_RUN_ID})"
          git push -q origin "$branch"
          verdict=$(cat "$dir/verdict.txt" 2>/dev/null || echo "no verdict (scenario_check did not run)")
          check=$(cat "$dir/replay-check.txt" 2>/dev/null || echo "no replay recorded")
          body=$(printf '%s\n' \
            "Adds ${added} from [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})." \
            "" "**Dispatch:** \`${HARNESS} ${ARGS}\` on \`ns3:${VERSION}\` at ${GITHUB_SHA}." \
            "" "**scenario_check results:**" '```' "$verdict" '```' \
            "" "**check-viz-trace (#641):**" '```' "$check" '```' \
            "" "$(if [ "$APP_TOKEN" = true ]; then echo "Opened by benchmark-cell.yml (#612) with the app token (#705); CI runs on this PR."; else echo "Opened by benchmark-cell.yml (#612). CI does not run on a workflow-opened PR (no app token configured, #705); close and reopen it to run checks."; fi)")
          if ! gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
                 --title "docs(bench): add ${name} (run ${GITHUB_RUN_ID})" --body "$body"; then
            url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...${branch}?expand=1"
            echo "::warning::could not open the PR (is 'Allow GitHub Actions to create pull requests' off?). The branch is pushed: $url"
            echo "Branch pushed; open the PR here: $url" >> "$GITHUB_STEP_SUMMARY"
          fi
