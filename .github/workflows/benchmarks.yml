name: Benchmarks

# After every merge to the default branch, re-run the scenario taxonomy across
# all baselines (AODV/OLSR/DSDV) and publish the refreshed results back into the
# repo: the cross-scenario summary in docs/benchmarks.md, the per-scenario pages
# in docs/benchmarks/scenarios/ AND the taxonomy chart in docs/benchmarks/. So
# the published numbers + figures always track the code.
#
# Scope: this runs the *discrete* named scenarios at time=120 s but
# runs=10 -- the #293/#314 published-point floor. It used to be the --quick
# preset (runs=2), which was a cost choice from when Actions minutes were
# believed billed; #121's answer (they are not) removed the reason, and #318
# removed the excuse: at 2 runs the tables now render t(1)-wide intervals
# their own methodology calls unpublishable. The 120 s duration stays -- the
# floor is about dispersion, not duration, and absolute plausibility is the
# anchor gate's job. The heavier parameter sweeps (area/pause/scale) stay in
# the manual "Scenario matrix + charts" workflow at 900 s / 20 seeds.
on:
  push:
    branches: [main, master]   # both, so it survives the default-branch rename
  # Backstop. The push trigger alone is not enough: see the concurrency note
  # below. A daily run bounds how stale the published table can get at 24 h,
  # whatever the merge cadence.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# Needed to push the regenerated table + charts back to the branch; packages to
# pull the pre-built ns-3 image.
permissions:
  contents: write
  packages: read

# One benchmark at a time; newer pushes supersede older queued runs -- for a
# *push*, the latest merge is the only state worth publishing, so cancelling is
# right and queueing would just build a backlog of tables nobody reads.
#
# But the event name is part of the group on purpose. With a single group,
# cancel-in-progress silently starves the refresh whenever merges arrive faster
# than the job takes: each push kills the run in flight, and the table simply
# stops regenerating. That happened -- eight merges landed between 07:43 and
# 17:50 UTC on 2026-07-26 and not one produced a refresh commit, so the
# published numbers sat on the far side of a shared-adapter change (#224) with
# nothing measuring it. Nothing failed; a cancelled run is not a failed run,
# which is exactly why it went unnoticed.
#
# Separating the groups means the scheduled backstop above cannot be cancelled
# by merge traffic, so the table always refreshes at least daily.
concurrency:
  group: benchmarks-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # Build against the pre-built plain ns-3 image (same as ci.yml) instead of
    # compiling ns-3 from source, so the job has budget to run the whole
    # taxonomy instead of a single scenario.
    container:
      image: ghcr.io/${{ github.repository_owner }}/ns3:3.42
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install AntHocNet module
        run: make install-ns3 NS3DIR=/opt/ns-3
      - name: Configure + build
        run: |
          cd /opt/ns-3
          ./ns3 configure --enable-examples \
            --enable-modules='anthocnet;gpsr;wifi;mobility;applications;csma;aodv;olsr;dsdv;flow-monitor;point-to-point'
          ./ns3 build
      - name: Install matplotlib
        run: apt-get update && apt-get install -y python3-matplotlib
      - name: Validation-anchor gate (blocks publish; #59)
        # Run the known-expected anchors on the *stock* baselines harness
        # before producing or publishing any numbers: if an anchor regresses
        # (cf. the #51 ~50% single-hop loss that silently depressed every
        # published PDR ~2x) this step fails and the table/charts below are
        # never refreshed from a mis-calibrated channel. Thresholds live in
        # ns3/tools/anchors.yml; rationale in docs/benchmarks/methodology.md
        # "Validation anchors".
        run: |
          bash ns3/tools/check-anchors.sh /opt/ns-3 single-hop
          bash ns3/tools/check-anchors.sh /opt/ns-3 broch-low-mobility
      - name: Run scenario taxonomy (10 runs, 120 s — the #318 floor)
        run: |
          python3 ns3/tools/run-scenarios.py /opt/ns-3 \
            --out "$GITHUB_WORKSPACE/scenarios.csv" --only discrete \
            --runs 10 --time 120
      - name: Render charts
        run: python3 ns3/tools/make-charts.py "$GITHUB_WORKSPACE/scenarios.csv" --outdir docs/benchmarks
      - name: Update results tables (index summary + per-scenario pages)
        # --commit/--run-url (#365): every regenerated block states the commit
        # it was measured at. Two things this buys that the page banners alone
        # do not. (1) The banners claim these numbers "track the current tip of
        # main" -- true only while this job keeps up, and it demonstrably does
        # not: eight merges on 2026-07-26 produced no refresh at all because
        # each push cancelled the run in flight, and nothing on the page said
        # so. A stamped commit that lags main makes that staleness readable.
        # (2) A reader who wants to reproduce a cell now has the SHA to check
        # out, which is the acceptance criterion of #365.
        #
        # The cost is churn: because the stamp changes on every merge, the
        # commit step below now fires on every merge instead of only when a
        # number moves. That is the intended trade -- an unchanged table
        # measured at a new commit is new information, not an empty commit.
        run: |
          python3 ns3/tools/update-benchmarks.py "$GITHUB_WORKSPACE/scenarios.csv" \
            docs/benchmarks.md \
            --commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Upload CSV + charts artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: |
            scenarios.csv
            scenarios-runs.csv
            docs/benchmarks/*.png
          retention-days: 7
      - name: Commit refreshed results (if changed)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/benchmarks.md docs/benchmarks
          if git diff --cached --quiet; then
            echo "Benchmark results unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "docs: refresh benchmark results + charts [skip ci]"
          git push
