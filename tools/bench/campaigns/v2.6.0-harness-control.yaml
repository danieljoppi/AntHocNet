# #769: the byte-identical control for the harness move (ADR-0027 §4). One
# cheap block (seeds 1-2) of every MANET-family cell committed in the v2.4.0
# and v2.5.0 generations, re-run through routing-compare at the branch that
# moves the harness, with the committed plan's own inputs and protocol list
# (the identity-matched ##COMMON## set depends on which arms share an
# invocation, so lists are never merged). The rule: every ##RUN##, ##ROUTE##
# and ##COMMON## row for seeds 1-2 equals the committed one (`source`). Any
# difference is a bug in the move, not noise.
#
#   python3 tools/bench/campaign.py plan tools/bench/campaigns/v2.6.0-harness-control.yaml
#   python3 tools/bench/harness_control.py tools/bench/campaigns/v2.6.0-harness-control.yaml
#
# Cells keep their committed names; the v2.5.0 comparator runs of the family
# cells carry a -cmp suffix, the v2.5.0 scale stage-2 runs -s2.
generation: pc769
ref: claude/next-release-finalization-2t0xkc
program: routing-compare
cap: 12
control: control

arms:
  control: ""

