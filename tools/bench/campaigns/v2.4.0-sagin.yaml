# The SAGIN family's first campaign (#581; docs/benchmarks/satellite/sagin.md):
# the three LEO shells of leo-walker with the HAPS air layer (--sagin: 3 HAPS
# per city at 20 km on a 150 km ring), on the family's native set declared
# before the first run (ADR-0026, maintainer decision on #581): AntHocNet,
# OPSPF and geo-greedy for the space layer, gpsr3d for the air layer, and the
# hop and delay oracles. One arm, control, at the shipped defaults; one job
# per (shell, protocol), as the LEO cells run. Pre-registered: merged before
# the first dispatch.
#
#   python3 tools/bench/campaign.py plan tools/bench/campaigns/v2.4.0-sagin.yaml
generation: v240
ref: main
cap: 12
control: control

arms:
  control: ""

x-leo: &leo {harness: leo-walker, version: "3.48", time: 300, runs: 20, flows: 4, cbrBps: 2048, islRate: 10Mbps, protocols: anthocnet}

# The two Starlink gpsr3d cells run in 2-seed blocks: the first dispatch of
# sagin-starlink1-gpsr3d (run 39590110792) needed about 55 min a seed and was
# cancelled at the 6 h runner limit after 5 of 20 seeds. Same cells, same
# seeds, split into jobs that fit (#581).
cells:
  sagin-walker16-anthocnet: {workflow: satellite-benchmark.yml, inputs: {<<: *leo, protocols: anthocnet, extraArgs: "--planes=16 --sats=16 --phasing=1 --altitude=1150 --inclination=53 --minElevation=25 --islDown=0.01 --sagin"}}
