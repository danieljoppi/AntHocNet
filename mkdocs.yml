site_name: AntHocNet
site_description: >-
  AntHocNet — an ant-colony-optimization MANET routing protocol implemented once
  as a simulator-agnostic core, with thin NS-2 and NS-3 adapters.
site_url: https://danieljoppi.github.io/AntHocNet/docs/
repo_url: https://github.com/danieljoppi/AntHocNet
repo_name: danieljoppi/AntHocNet
edit_uri: edit/main/docs/
copyright: GPL-2.0-or-later — the repository tree is canonical; this site renders it.

docs_dir: docs

# --- Relative links that escape docs/ (#331) --------------------------------
# docs/*.md link out of the docs tree with `../` — ../AGENTS.md, ../CONTEXT.md,
# ../CONTRIBUTING.md, ../core/…, ../ns3/tools/…, ../.github/… — and
# with `docs_dir: docs` those targets are outside the site. The options were:
#
#   (a) mkdocs-monorepo / same-dir plugins — an extra dependency that still
#       cannot render ../core/src/*.cpp or ../ns3/tools/*.py as site pages.
#   (b) `docs_dir: .` plus an exclude list — impossible: mkdocs rejects a
#       docs_dir that is the config file's own directory ("The 'docs_dir'
#       should not be the parent directory of the config file"), and it would
#       otherwise copy the whole repo into the site.
#   (c) point the escaping links at GitHub  <-- CHOSEN
#   (d) accept the warnings with `strict: false` and let those links 404 on
#       the site — ~40 dead links on the discoverability surface this site
#       exists to provide.
#
# (c) is implemented by docs/tools/mkdocs_hooks.py, which rewrites *only* the
# escaping targets to https://github.com/danieljoppi/AntHocNet/blob|tree/main/…
# while the markdown is rendered. No .md file is modified: the repo tree stays
# canonical and every link keeps working when read on GitHub.
#
# Tradeoff: on the site those links leave the site — a reader who clicks
# `../AGENTS.md` lands on GitHub instead of a rendered page. That is deliberate
# (those files are repo-tree artefacts, not site pages) but it does mean the
# site is not a self-contained mirror of the documentation, and the hook is one
# more moving part that a future docs_dir change would have to keep in step.
hooks:
  - docs/tools/mkdocs_hooks.py

theme:
  name: material
  # The site shell (#627): Material's header and tabs are replaced by the
  # site's one top bar (web/shell/, injected by docs/tools/mkdocs_hooks.py).
  # With navigation.tabs the left sidebar lists only the current place.
  custom_dir: web/shell/mkdocs
  # No Google Fonts request: the shell sets a system font stack (web/shell/).
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  # Mermaid: the docs carry many diagrams and CI already gates that they parse
  # (docs/tools/check-mermaid.py in lint.yml), so they must render here too.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

